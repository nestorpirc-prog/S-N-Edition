<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BUIZNES IMPERIA | OMEGA INFERNO</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;400;700;900&family=JetBrains+Mono:wght@300;800&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS VARIABLES & THEME --- */
        :root {
            --fire-core: #ff4d00;
            --fire-glow: #ffae00;
            --magma-dark: #1a0505;
            --void-black: #020203;
            --neon-blue: #00d2ff;
            --glass-alpha: rgba(255, 255, 255, 0.03);
            --border-glow: rgba(255, 77, 0, 0.3);
            --font-main: 'Space Grotesk', sans-serif;
            --font-logo: 'Outfit', sans-serif;
            --font-tech: 'JetBrains Mono', monospace;
        }

        /* --- GLOBAL RESET --- */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body, html { 
            background: var(--void-black); color: #fff; font-family: var(--font-main);
            height: 100dvh; width: 100%; overflow: hidden; position: fixed;
            -webkit-user-select: none; user-select: none;
        }

        /* --- PROCEDURAL MAGMA BACKGROUND --- */
        #magma-canvas { position: fixed; inset: 0; z-index: -2; opacity: 0.6; }
        .overlay-vignette { 
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.8) 100%),
                        linear-gradient(0deg, rgba(255,77,0,0.1) 0%, transparent 100%);
            pointer-events: none;
        }

        /* --- AUTH SCREEN: OMEGA STYLE --- */
        #auth-layer {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; align-items: center; justify-content: center; padding: 20px;
            transition: 1.5s cubic-bezier(0.8, 0, 0.2, 1);
        }

        .auth-container {
            width: 100%; max-width: 480px; background: rgba(5, 5, 10, 0.9);
            backdrop-filter: blur(60px); border-radius: 40px; padding: 60px 45px;
            border: 1px solid var(--border-glow); box-shadow: 0 0 100px rgba(255, 77, 0, 0.2);
            text-align: center; position: relative; overflow: hidden;
        }

        .auth-container::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(from 180deg at 50% 50%, transparent 0deg, var(--fire-core) 360deg);
            animation: rotateGlow 10s linear infinite; opacity: 0.1; z-index: -1;
        }

        @keyframes rotateGlow { 100% { transform: rotate(360deg); } }

        .logo-main { font-family: var(--font-logo); font-size: 4.5rem; font-weight: 900; line-height: 0.8; letter-spacing: -4px; margin-bottom: 10px; }
        .logo-sub { color: var(--fire-glow); font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 5px; margin-bottom: 40px; }

        .field-box { text-align: left; margin-bottom: 25px; position: relative; }
        .field-box label { font-family: var(--font-tech); font-size: 0.65rem; color: #666; margin-left: 20px; text-transform: uppercase; display: block; margin-bottom: 8px; }
        
        .omega-input {
            width: 100%; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1);
            padding: 22px 25px; border-radius: 20px; color: #fff; font-size: 1rem;
            transition: 0.3s; font-family: var(--font-tech);
        }
        .omega-input:focus { border-color: var(--fire-core); background: rgba(255, 77, 0, 0.05); outline: none; }

        .omega-btn {
            width: 100%; background: #fff; color: #000; border: none; padding: 25px;
            border-radius: 25px; font-weight: 900; font-family: var(--font-logo);
            font-size: 1.3rem; cursor: pointer; transition: 0.5s; position: relative; overflow: hidden;
        }
        .omega-btn span { position: relative; z-index: 2; }
        .omega-btn::before {
            content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, var(--fire-core), var(--fire-glow));
            transform: translateX(-100%); transition: 0.5s;
        }
        .omega-btn:hover::before { transform: translateX(0); }
        .omega-btn:hover { color: #fff; transform: translateY(-3px); }

        .error-log { margin-top: 25px; font-family: var(--font-tech); font-size: 0.75rem; min-height: 40px; border-radius: 15px; display: flex; align-items: center; justify-content: center; padding: 10px; }

        /* --- APPLICATION SHELL --- */
        #root-app { display: none; opacity: 0; height: 100dvh; flex-direction: column; }

        .hud-header { padding: 45px 30px 20px; text-align: center; }
        .status-pill { background: rgba(255,255,255,0.05); padding: 6px 16px; border-radius: 100px; font-size: 0.65rem; font-weight: 900; color: var(--fire-glow); text-transform: uppercase; border: 1px solid var(--border-glow); }

        .balance-hero { font-family: var(--font-logo); font-size: 6.5rem; font-weight: 900; letter-spacing: -5px; margin: 15px 0; line-height: 0.8; }
        .pps-counter { font-family: var(--font-tech); color: #666; font-size: 0.85rem; }

        .xp-system { width: 280px; margin: 30px auto; }
        .xp-track { height: 4px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; position: relative; }
        .xp-bar { height: 100%; background: var(--fire-core); width: 0%; transition: 0.4s cubic-bezier(0, 1, 0, 1); box-shadow: 0 0 15px var(--fire-core); }
        .xp-label { display: flex; justify-content: space-between; font-size: 0.6rem; font-weight: 800; margin-top: 8px; color: #444; text-transform: uppercase; }

        /* CLICK ENGINE */
        #game-view { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
        .omega-coin {
            width: 300px; height: 300px; border-radius: 50%; position: relative;
            background: radial-gradient(circle at 30% 30%, #ff8c00, #ff4500, #8b0000);
            border: 15px solid rgba(255,255,255,0.9); cursor: pointer;
            box-shadow: 0 60px 140px rgba(0,0,0,1), inset 0 0 80px rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
            font-family: var(--font-logo); font-size: 10rem; color: rgba(0,0,0,0.4); font-weight: 900;
            transition: 0.05s; z-index: 50;
        }
        .omega-coin:active { transform: scale(0.85) rotate(-5deg); filter: brightness(1.3); }

        /* SCREENS & CARDS */
        .screen-content { display: none; height: 100%; overflow-y: auto; padding: 20px 25px 200px; }
        .screen-content.active { display: block; animation: screenReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) both; }
        @keyframes screenReveal { from { opacity: 0; transform: scale(0.95) translateY(30px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        .upgrade-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
            border: 1px solid rgba(255,255,255,0.05); border-radius: 35px; padding: 30px;
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
            backdrop-filter: blur(20px); transition: 0.3s;
        }
        .upgrade-card:hover { border-color: var(--fire-core); background: rgba(255, 77, 0, 0.03); }

        .up-info h4 { font-family: var(--font-logo); font-size: 1.4rem; margin-bottom: 5px; }
        .up-info p { font-size: 0.8rem; color: #777; font-weight: 500; }

        .buy-trigger {
            background: #fff; color: #000; border: none; padding: 20px 30px;
            border-radius: 20px; font-weight: 900; font-family: var(--font-tech); font-size: 0.9rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2); transition: 0.2s;
        }
        .buy-trigger.locked { opacity: 0.3; filter: grayscale(1); cursor: not-allowed; }

        /* LEADERBOARD V2 */
        .rank-container { background: rgba(0,0,0,0.5); border-radius: 40px; border: 1px solid var(--glass-alpha); overflow: hidden; }
        .rank-entry { display: flex; align-items: center; justify-content: space-between; padding: 25px 30px; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .rank-entry.is-me { background: rgba(255, 77, 0, 0.08); border-left: 4px solid var(--fire-core); }
        .rank-num { font-family: var(--font-tech); width: 40px; color: var(--fire-core); font-weight: 800; }
        .rank-name { flex: 1; font-weight: 700; font-size: 1rem; }

        /* BOTTOM NAVIGATION */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; background: rgba(2, 2, 3, 0.9);
            backdrop-filter: blur(50px); border-top: 1px solid rgba(255,255,255,0.05);
            display: flex; justify-content: space-around; padding: 25px 10px 50px; z-index: 1000;
        }
        .nav-btn {
            background: none; border: none; color: #444; display: flex; flex-direction: column;
            align-items: center; gap: 8px; font-weight: 900; font-family: var(--font-tech);
            font-size: 0.6rem; text-transform: uppercase; letter-spacing: 1px; transition: 0.4s;
        }
        .nav-btn.active { color: var(--fire-core); transform: translateY(-10px); }
        .nav-btn svg { width: 28px; height: 28px; transition: 0.4s; }
        .nav-btn.active svg { filter: drop-shadow(0 0 8px var(--fire-core)); }

        /* NOTIFICATIONS & FX */
        .toast { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); background: #fff; color: #000; padding: 12px 25px; border-radius: 100px; font-weight: 800; z-index: 10001; font-size: 0.8rem; display: none; animation: toastIn 0.5s forwards; }
        @keyframes toastIn { from { top: -50px; opacity: 0; } to { top: 30px; opacity: 1; } }

        .particle { position: fixed; pointer-events: none; background: var(--fire-core); border-radius: 50%; z-index: 5; animation: particleOut 1s ease-out forwards; }
        @keyframes particleOut { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(0) translateY(-100px); opacity: 0; } }

        .floating-text { position: fixed; color: var(--fire-glow); font-weight: 900; font-size: 3.5rem; pointer-events: none; z-index: 60; font-family: var(--font-logo); animation: floatHigh 1.2s cubic-bezier(0.1, 0.9, 0.2, 1) forwards; text-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        @keyframes floatHigh { 0% { opacity: 1; transform: translate(0, 0) scale(1); } 100% { opacity: 0; transform: translate(var(--dx), -300px) scale(1.8) rotate(var(--dr)); } }

    </style>
</head>
<body>

    <canvas id="magma-canvas"></canvas>
    <div class="overlay-vignette"></div>

    <div id="auth-layer">
        <div class="auth-container">
            <div class="logo-main">BUIZNES</div>
            <div class="logo-sub">Inferno Omega</div>
            
            <div class="field-box">
                <label>Terminal Email</label>
                <input type="email" id="email-omega" class="omega-input" placeholder="root@imperia.io" autocomplete="off">
            </div>

            <div class="field-box">
                <label>Security Key</label>
                <input type="password" id="pass-omega" class="omega-input" placeholder="••••••••" autocomplete="off">
            </div>

            <button class="omega-btn" id="btn-omega" onclick="trySystemAccess()">
                <span>INITIALIZE SYNC</span>
            </button>

            <div id="omega-log" class="error-log"></div>
        </div>
    </div>

    <div id="root-app">
        
        <div id="view-main" class="screen-content active">
            <div class="hud-header">
                <span class="status-pill" id="rank-name">Initializing...</span>
                <h1 class="balance-hero" id="stat-money">$ 0</h1>
                <div class="pps-counter" id="stat-pps">Mining Rate: $0.00/s</div>
                
                <div class="xp-system">
                    <div class="xp-track"><div id="xp-fill" class="xp-bar"></div></div>
                    <div class="xp-label">
                        <span id="lvl-cur">Level 1</span>
                        <span id="lvl-next">Level 2</span>
                    </div>
                </div>
            </div>

            <div id="game-view">
                <div class="omega-coin" onclick="performTap(event)">Ω</div>
            </div>
        </div>

        <div id="view-shop" class="screen-content">
            <h2 style="font-family: var(--font-logo); font-size: 3rem; margin-bottom: 40px; letter-spacing: -2px;">BLACK MARKET</h2>
            
            <div id="shop-items-container">
                </div>
        </div>

        <div id="view-top" class="screen-content">
            <h2 style="font-family: var(--font-logo); font-size: 3rem; margin-bottom: 40px; letter-spacing: -2px;">FORBES 500</h2>
            <div class="rank-container" id="forbes-list">
                </div>
        </div>

        <nav class="bottom-nav">
            <button class="nav-btn active" onclick="navigate('main')">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 12h3v8h6v-6h2v6h6v-8h3L12 2z"/></svg>
                <span>Empire</span>
            </button>
            <button class="nav-btn" onclick="navigate('shop')">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
                <span>Market</span>
            </button>
            <button class="nav-btn" onclick="navigate('top')">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L9 9l-8 .5 6 5.5-2 8 7-4.5 7 4.5-2-8 6-5.5-8-.5L12 1z"/></svg>
                <span>Ranks</span>
            </button>
        </nav>
    </div>

    <div class="toast" id="toast-notify">SAVED TO CLOUD</div>

    <script>
        /* --- CORE CONFIGURATION --- */
        const INFERNO_CONFIG = {
            dbUrl: "https://buiznesimperia-default-rtdb.firebaseio.com/",
            shop: [
                { id: 'tap', name: 'Inferno Touch', desc: 'Increases profit per tap', base: 50, mult: 1.8, val: 1, type: 'p' },
                { id: 'bot', name: 'Neural Miner', desc: 'Automated crypto harvester', base: 500, mult: 1.5, val: 5, type: 's' },
                { id: 'corp', name: 'Shell Company', desc: 'Laundering profits', base: 4500, mult: 1.6, val: 45, type: 's' },
                { id: 'bank', name: 'Swiss Bank', desc: 'Global financial control', base: 35000, mult: 1.7, val: 320, type: 's' },
                { id: 'ai', name: 'Omega AI', desc: 'Predictive market dominance', base: 250000, mult: 1.9, val: 2400, type: 's' },
                { id: 'void', name: 'Dark Energy', desc: 'Infinite resource extraction', base: 1500000, mult: 2.1, val: 15000, type: 's' }
            ]
        };

        let state = {
            money: 0, power: 1, pps: 0,
            lvl: 1, exp: 0,
            uid: null, nick: 'Unknown',
            activeScreen: 'main',
            lastSync: Date.now()
        };

        let firebaseReady = false;

        /* --- BACKGROUND CANVAS ENGINE --- */
        const canvas = document.getElementById('magma-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        class MagmaDrop {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 100;
                this.size = Math.random() * 100 + 50;
                this.speed = Math.random() * 1 + 0.5;
                this.opacity = Math.random() * 0.3;
            }
            draw() {
                ctx.beginPath();
                let g = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
                g.addColorStop(0, `rgba(255, 77, 0, ${this.opacity})`);
                g.addColorStop(1, 'transparent');
                ctx.fillStyle = g;
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                this.y -= this.speed;
                if (this.y < -100) this.reset();
            }
        }

        function initCanvas() {
            resize();
            for(let i=0; i<20; i++) particles.push(new MagmaDrop());
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => p.draw());
                requestAnimationFrame(animate);
            }
            animate();
        }

        /* --- FIREBASE BOOTSTRAP (ANTI-ERROR) --- */
        function trySystemAccess() {
            const e = document.getElementById('email-omega').value;
            const p = document.getElementById('pass-omega').value;
            const l = document.getElementById('omega-log');

            if (e.length < 5 || p.length < 6) {
                l.style.color = '#ff4d4d';
                l.innerText = "PROTOCOL ERROR: INVALID CREDENTIALS";
                return;
            }

            // CRITICAL: Ініціалізація лише в момент кліку
            if (!firebase.apps.length) {
                firebase.initializeApp({ databaseURL: INFERNO_CONFIG.dbUrl });
            }

            l.style.color = '#ffae00';
            l.innerText = "BYPASSING FIREWALL... ESTABLISHING SYNC";

            firebase.auth().signInWithEmailAndPassword(e, p)
                .catch(() => firebase.auth().createUserWithEmailAndPassword(e, p))
                .catch(err => {
                    l.style.color = '#ff4d4d';
                    l.innerText = "CRITICAL FAIL: " + err.message;
                });
        }

        firebase.auth().onAuthStateChanged(user => {
            if (user) {
                state.uid = user.uid;
                state.nick = user.email.split('@')[0];
                launchEmpire();
            }
        });

        /* --- GAME CORE --- */
        function launchEmpire() {
            const auth = document.getElementById('auth-layer');
            auth.style.transform = 'translateY(-100%)';
            auth.style.opacity = '0';
            setTimeout(() => auth.style.display = 'none', 1500);

            const app = document.getElementById('root-app');
            app.style.display = 'flex';
            setTimeout(() => app.style.opacity = '1', 500);

            // Connect Database
            firebase.database().ref('users/' + state.uid).on('value', snap => {
                const d = snap.val();
                if (d) {
                    state.money = d.m || 0;
                    state.power = d.p || 1;
                    state.pps = d.s || 0;
                    state.lvl = d.l || 1;
                    state.exp = d.e || 0;
                    updateVisuals();
                }
            });

            buildShop();
            
            // Engines
            setInterval(() => {
                if (state.pps > 0) {
                    state.money += (state.pps / 10);
                    updateVisuals();
                }
            }, 100);

            setInterval(cloudSave, 10000);
            syncForbes();
        }

        function performTap(ev) {
            state.money += state.power;
            state.exp += 1;

            const next = state.lvl * 150;
            if (state.exp >= next) {
                state.lvl++;
                state.exp = 0;
                notify(`LEVEL UP: ${state.lvl}`);
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            }

            createFloatingText(ev);
            updateVisuals();
            if (navigator.vibrate) navigator.vibrate(20);
        }

        function buildShop() {
            const container = document.getElementById('shop-items-container');
            container.innerHTML = '';
            INFERNO_CONFIG.shop.forEach(item => {
                const card = document.createElement('div');
                card.className = 'upgrade-card';
                card.innerHTML = `
                    <div class="up-info">
                        <h4 id="n-${item.id}">${item.name}</h4>
                        <p>${item.desc}</p>
                    </div>
                    <button class="buy-trigger" id="btn-${item.id}" onclick="executePurchase('${item.id}')">
                        $ 0
                    </button>
                `;
                container.appendChild(card);
            });
        }

        function executePurchase(id) {
            const item = INFERNO_CONFIG.shop.find(x => x.id === id);
            let currentCost = 0;
            
            if (item.type === 'p') {
                currentCost = Math.floor(item.base * Math.pow(item.mult, state.power));
                if (state.money >= currentCost) {
                    state.money -= currentCost;
                    state.power += item.val;
                }
            } else {
                // Calculation based on PPS levels
                const count = state.pps / item.val;
                currentCost = Math.floor(item.base * Math.pow(item.mult, count));
                if (state.money >= currentCost) {
                    state.money -= currentCost;
                    state.pps += item.val;
                }
            }
            updateVisuals();
            cloudSave();
        }

        function updateVisuals() {
            document.getElementById('stat-money').innerText = '$ ' + Math.floor(state.money).toLocaleString();
            document.getElementById('stat-pps').innerText = `Mining Rate: $${state.pps.toFixed(2)}/s`;
            document.getElementById('lvl-cur').innerText = `Level ${state.lvl}`;
            document.getElementById('lvl-next').innerText = `Level ${state.lvl + 1}`;
            
            const xpPct = (state.exp / (state.lvl * 150)) * 100;
            document.getElementById('xp-fill').style.width = xpPct + '%';

            // Shop prices update
            INFERNO_CONFIG.shop.forEach(item => {
                let cost = 0;
                if (item.type === 'p') {
                    cost = Math.floor(item.base * Math.pow(item.mult, state.power));
                } else {
                    const count = state.pps / item.val;
                    cost = Math.floor(item.base * Math.pow(item.mult, count));
                }
                const btn = document.getElementById('btn-' + item.id);
                btn.innerText = '$' + cost.toLocaleString();
                btn.className = state.money >= cost ? 'buy-trigger afford' : 'buy-trigger locked';
            });

            // Rank Logic
            let r = "Hobo Investor";
            if (state.lvl > 10) r = "Street Dealer";
            if (state.lvl > 25) r = "Local Boss";
            if (state.lvl > 50) r = "Shadow Oligarch";
            if (state.lvl > 100) r = "World Controller";
            if (state.lvl > 250) r = "Omega Deity";
            document.getElementById('rank-name').innerText = r;
        }

        /* --- CLOUD & SOCIAL --- */
        function cloudSave() {
            if (!state.uid) return;
            firebase.database().ref('users/' + state.uid).update({
                m: state.money, p: state.power, s: state.pps,
                l: state.lvl, e: state.exp, u: state.nick,
                t: firebase.database.ServerValue.TIMESTAMP
            });
        }

        function syncForbes() {
            firebase.database().ref('users').orderByChild('m').limitToLast(20).on('value', snap => {
                const board = document.getElementById('forbes-list');
                board.innerHTML = '';
                let ranks = [];
                snap.forEach(c => ranks.push(c.val()));
                ranks.reverse().forEach((u, i) => {
                    const isMe = u.u === state.nick ? 'is-me' : '';
                    board.innerHTML += `
                        <div class="rank-entry ${isMe}">
                            <span class="rank-num">#${i+1}</span>
                            <span class="rank-name">${u.u}</span>
                            <b style="color:var(--fire-glow)">$${Math.floor(u.m).toLocaleString()}</b>
                        </div>
                    `;
                });
            });
        }

        /* --- UTILS & FX --- */
        function createFloatingText(e) {
            const t = document.createElement('div');
            t.className = 'floating-text';
            const x = e.clientX || e.touches[0].clientX;
            const y = e.clientY || e.touches[0].clientY;
            t.style.left = x + 'px';
            t.style.top = y + 'px';
            t.style.setProperty('--dx', (Math.random() * 200 - 100) + 'px');
            t.style.setProperty('--dr', (Math.random() * 40 - 20) + 'deg');
            t.innerText = `+$${state.power}`;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 1100);
            
            // Simple particles
            for(let i=0; i<5; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.width = p.style.height = (Math.random() * 8 + 4) + 'px';
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 1000);
            }
        }

        function notify(msg) {
            const t = document.getElementById('toast-notify');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        function navigate(id) {
            document.querySelectorAll('.screen-content').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('view-' + id).classList.add('active');
            event.currentTarget.classList.add('active');
            state.activeScreen = id;
        }

        window.addEventListener('resize', resize);
        initCanvas();
    </script>
</body>
</html>
