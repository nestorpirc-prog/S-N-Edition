<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GOLDEN EQUITY | LIVE DOMINATION</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #ffcc00;
            --neon-blue: #00d4ff;
            --bg: #020202;
            --panel: rgba(15, 15, 15, 0.9);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { 
            margin: 0; padding: 0; background: var(--bg); color: white; 
            font-family: 'Share Tech Mono', monospace; height: 100%; overflow: hidden;
        }

        /* --- MATRIX RAIN BACKGROUND --- */
        canvas { position: fixed; top: 0; left: 0; z-index: 0; opacity: 0.3; }

        #app { position: relative; z-index: 10; height: 100vh; display: flex; flex-direction: column; }

        /* --- LOGIN SCREEN --- */
        .auth-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; padding: 20px; text-align: center;
        }
        .glitch-header {
            font-family: 'Orbitron', sans-serif; font-size: 2.5rem; color: var(--gold);
            text-shadow: 2px 2px var(--neon-blue); letter-spacing: 5px; margin-bottom: 40px;
        }
        .input-group { background: var(--panel); border: 1px solid var(--gold); padding: 5px; display: flex; width: 100%; max-width: 300px; }
        input { 
            flex: 1; background: none; border: none; color: white; padding: 15px; 
            font-family: inherit; outline: none; font-size: 1.1rem;
        }
        .enter-btn { background: var(--gold); border: none; padding: 0 20px; cursor: pointer; font-weight: bold; }

        /* --- GAME HUD --- */
        .hud { padding: 20px; border-bottom: 1px solid #222; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); }
        .bal { font-family: 'Orbitron', sans-serif; font-size: 2.4rem; color: #fff; text-align: center; }
        .inc { color: var(--neon-blue); font-size: 0.8rem; text-align: center; margin-top: 5px; opacity: 0.8; }

        /* --- LIVE FEED --- */
        .live-feed {
            height: 30px; background: rgba(0, 212, 255, 0.1); color: var(--neon-blue);
            font-size: 0.7rem; display: flex; align-items: center; padding: 0 15px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.2); overflow: hidden;
        }

        /* --- CLICK AREA --- */
        .main-engine { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .core {
            width: 220px; height: 220px; border-radius: 40px;
            border: 2px solid var(--gold); background: rgba(255, 204, 0, 0.03);
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 40px rgba(255, 204, 0, 0.1); transition: 0.1s;
        }
        .core:active { transform: scale(0.92) rotate(5deg); background: rgba(255, 204, 0, 0.1); }

        /* --- TABS --- */
        .tab-content { display: none; flex: 1; padding: 20px; overflow-y: auto; padding-bottom: 100px; }
        .active-tab { display: block; }

        /* --- LISTS --- */
        .card {
            background: var(--panel); border: 1px solid #222; padding: 15px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .online-dot { width: 8px; height: 8px; background: #00FF41; border-radius: 50%; display: inline-block; margin-right: 8px; box-shadow: 0 0 10px #00FF41; }

        /* --- NAV --- */
        .nav { position: fixed; bottom: 0; width: 100%; height: 75px; background: #000; border-top: 1px solid #222; display: flex; }
        .nav-btn { flex: 1; background: none; border: none; color: #444; font-family: 'Orbitron', sans-serif; font-size: 0.6rem; }
        .nav-btn.active { color: var(--gold); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<canvas id="matrix"></canvas>

<div id="app">
    <div id="auth-screen" class="auth-screen">
        <h1 class="glitch-header">GOLDEN EQUITY</h1>
        <p style="color: #444; letter-spacing: 4px; font-size: 0.8rem; margin-bottom: 20px;">SYSTEM ARCHITECTS: NESTOR & SANYA</p>
        <div class="input-group">
            <input type="text" id="user-input" placeholder="ACCESS_ID" maxlength="12">
            <button class="enter-btn" onclick="startApp()">></button>
        </div>
    </div>

    <div id="game-screen" class="hidden" style="height: 100%; display: flex; flex-direction: column;">
        <div class="hud">
            <div class="bal" id="bal-val">$ 0</div>
            <div class="inc" id="inc-val">SYSTEM_LOAD: +$0/SEC</div>
        </div>
        
        <div class="live-feed">
            <span id="feed-text">>> SYSTEM INITIALIZED. WELCOME, OPERATOR.</span>
        </div>

        <div id="tab-core" class="tab-content active-tab">
            <div class="main-engine">
                <div class="core" onclick="tap(event)">
                    <span style="font-size: 3rem; color: var(--gold); font-family: 'Orbitron';">GE</span>
                </div>
                <p style="margin-top: 40px; color: #333; letter-spacing: 10px;">DATA_MINING</p>
            </div>
        </div>

        <div id="tab-online" class="tab-content">
            <h3 style="color: var(--gold); border-bottom: 1px solid #222; padding-bottom: 10px;">LIVE OPERATORS</h3>
            <div id="online-list">
                <div class="card">
                    <div><span class="online-dot"></span><strong>NESTOR</strong></div>
                    <div style="color: var(--gold);">$999T</div>
                </div>
                <div class="card">
                    <div><span class="online-dot"></span><strong>SANYA</strong></div>
                    <div style="color: var(--gold);">$999T</div>
                </div>
            </div>
        </div>

        <div id="tab-shop" class="tab-content">
            <div class="card">
                <div><h3>Botnet</h3><p>+$5/s | Cost: $100</p></div>
                <button class="enter-btn" style="height: 40px;" onclick="buy(100, 5)">BUY</button>
            </div>
        </div>

        <nav class="nav">
            <button class="nav-btn active" onclick="showTab('core', this)">CORE</button>
            <button class="nav-btn" onclick="showTab('shop', this)">ASSETS</button>
            <button class="nav-item" style="flex:1; border:none; background:none; color:#444;" onclick="showTab('online', this)">LIVE</button>
        </nav>
    </div>
</div>

<script>
    // --- MATRIX BACKGROUND ---
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    let columns;
    const charSize = 18;
    let drops = [];

    function initMatrix() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        columns = Math.floor(canvas.width / charSize);
        drops = new Array(columns).fill(1);
    }
    initMatrix(); window.onresize = initMatrix;

    function drawMatrix() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffcc00'; ctx.font = charSize + 'px monospace';
        for(let i=0; i<drops.length; i++) {
            const text = Math.floor(Math.random()*2);
            ctx.fillText(text, i*charSize, drops[i]*charSize);
            if(drops[i]*charSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }
    setInterval(drawMatrix, 50);

    // --- GAME LOGIC ---
    let stats = {
        name: '',
        money: parseFloat(localStorage.getItem('g_m')) || 0,
        pps: parseFloat(localStorage.getItem('g_p')) || 0
    };

    function startApp() {
        const input = document.getElementById('user-input').value;
        if(input.length < 2) return alert("ENTER VALID ID");
        stats.name = input.toUpperCase();
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        updateUI();
        addToFeed(`PLAYER ${stats.name} CONNECTED TO GRID.`);
    }

    function tap(e) {
        stats.money += 1;
        if(navigator.vibrate) navigator.vibrate(10);
        updateUI();
    }

    function buy(cost, p) {
        if(stats.money >= cost) {
            stats.money -= cost;
            stats.pps += p;
            updateUI();
            addToFeed(`ASSET ACQUIRED BY ${stats.name}.`);
        }
    }

    function updateUI() {
        document.getElementById('bal-val').innerText = '$ ' + Math.floor(stats.money).toLocaleString();
        document.getElementById('inc-val').innerText = 'SYSTEM_LOAD: +$' + stats.pps.toLocaleString() + '/SEC';
        localStorage.setItem('g_m', stats.money);
        localStorage.setItem('g_p', stats.pps);
    }

    function showTab(t, btn) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active-tab'));
        document.getElementById('tab-'+t).classList.add('active-tab');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function addToFeed(msg) {
        document.getElementById('feed-text').innerText = '>> ' + msg;
    }

    setInterval(() => { stats.money += stats.pps; updateUI(); }, 1000);
</script>

<script type="module">
  // Сюди в майбутньому додається код Firebase, який:
  // 1. При вході пише в базу: users[stats.name] = { online: true, money: stats.money }
  // 2. Функція onDisconnect() автоматично видаляє юзера з бази, коли він закриває вкладку
</script>

</body>
</html>
