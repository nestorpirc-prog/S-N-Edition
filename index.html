<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BUIZNES IMPERIA | FULL EDITION</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;900&family=Plus+Jakarta+Sans:wght@400;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --p-green: #22c55e; --p-blue: #3b82f6; --bg: #020617; 
            --glass: rgba(255, 255, 255, 0.05); --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body, html { 
            background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; 
            height: 100dvh; width: 100%; overflow: hidden; position: fixed; 
        }

        /* --- АНІМОВАНИЙ ДІАГОНАЛЬНИЙ ГРАДІЄНТ --- */
        #auth-screen { 
            position: fixed; inset: 0; z-index: 10000; 
            display: flex; align-items: center; justify-content: center; padding: 25px;
            background: linear-gradient(-45deg, #fbbf24, #f97316, #3b82f6, #2563eb, #a855f7);
            background-size: 400% 400%;
            animation: rainbowFlow 12s ease infinite;
        }

        @keyframes rainbowFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .auth-card { 
            background: rgba(0, 0, 0, 0.75); width: 100%; max-width: 420px; padding: 45px; 
            border-radius: 45px; backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.15);
            text-align: center; box-shadow: 0 25px 60px rgba(0,0,0,0.5);
        }

        .auth-card h1 { font-family: 'Outfit'; font-size: 2.5rem; margin-bottom: 10px; letter-spacing: -1px; }
        .auth-card p { font-size: 0.9rem; color: #94a3b8; margin-bottom: 30px; }

        .auth-input { 
            width: 100%; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); 
            padding: 20px; border-radius: 22px; color: #fff; margin-bottom: 15px; font-size: 1rem;
            transition: 0.3s;
        }
        .auth-input:focus { border-color: var(--p-blue); background: rgba(255,255,255,0.12); }

        .btn-enter { 
            width: 100%; background: #fff; color: #000; border: none; 
            padding: 22px; border-radius: 22px; font-weight: 900; font-family: 'Outfit'; 
            font-size: 1.2rem; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-enter:active { transform: scale(0.94); opacity: 0.9; }

        #err-msg { 
            color: #ff4d4d; font-size: 0.75rem; margin-top: 15px; min-height: 1.5em; 
            padding: 10px; border-radius: 10px; display: none;
        }

        /* --- ОСНОВНИЙ ДОДАТОК --- */
        #app-ui { display: none; height: 100dvh; flex-direction: column; opacity: 0; transition: 0.8s; }
        
        .screen-view { display: none; height: 100%; overflow-y: auto; padding: 30px 25px 150px; }
        .screen-view.active { display: block; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* HUD & STATS */
        .hud-top { text-align: center; padding: 40px 0 20px; }
        .money-text { font-family: 'Outfit'; font-size: 5rem; font-weight: 900; letter-spacing: -3px; line-height: 1; margin: 10px 0; }
        .badge { color: var(--p-green); font-weight: 800; font-size: 0.7rem; letter-spacing: 4px; text-transform: uppercase; }
        
        .xp-container { width: 160px; height: 8px; background: rgba(255,255,255,0.1); margin: 15px auto; border-radius: 10px; overflow: hidden; }
        #xp-bar { height: 100%; background: var(--p-green); width: 0%; transition: 0.4s; }

        /* CLICKER ZONE */
        .click-area { height: 42vh; display: flex; align-items: center; justify-content: center; position: relative; }
        .main-coin { 
            width: 240px; height: 240px; border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fbbf24, #b45309);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Outfit'; font-size: 7.5rem; font-weight: 900; color: #78350f;
            box-shadow: 0 35px 80px rgba(0,0,0,0.6), inset 0 0 50px rgba(255,255,255,0.3);
            border: 12px solid #fef3c7; cursor: pointer; transition: 0.05s; z-index: 10;
        }
        .main-coin:active { transform: scale(0.86) rotate(-2deg); }

        /* SHOP & LISTS */
        .upgrade-card { 
            background: var(--glass); padding: 22px; border-radius: 30px; 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 15px; border: 1px solid var(--border);
        }
        .u-info h4 { font-size: 1rem; margin-bottom: 4px; }
        .u-info p { font-size: 0.75rem; color: #94a3b8; }
        
        .buy-action { 
            background: var(--p-blue); color: #fff; border: none; padding: 14px 22px; 
            border-radius: 18px; font-weight: 900; font-size: 0.85rem; transition: 0.2s;
        }
        .buy-action:active { transform: scale(0.9); }

        /* RANKING */
        .rank-list { background: var(--glass); border-radius: 30px; overflow: hidden; }
        .user-row { display: flex; justify-content: space-between; padding: 20px; border-bottom: 1px solid var(--border); }
        .user-row.current-user { background: rgba(34, 197, 94, 0.15); color: var(--p-green); font-weight: 800; }

        /* NAVBAR */
        .bottom-nav { 
            position: fixed; bottom: 0; width: 100%; background: rgba(2,6,23,0.95); 
            backdrop-filter: blur(30px); border-top: 1px solid var(--border); 
            display: flex; justify-content: space-around; padding: 20px 10px 45px; 
        }
        .tab-btn { background: none; border: none; color: #64748b; font-weight: 900; font-size: 0.7rem; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .tab-btn.active { color: var(--p-green); }

        /* TAP EFFECTS */
        .tap-pop { position: fixed; color: var(--p-green); font-weight: 900; font-size: 2.5rem; pointer-events: none; animation: popUp 0.8s forwards; z-index: 9999; }
        @keyframes popUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-180px) scale(1.5); } }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-card">
            <h1>BUIZNES ENTRY</h1>
            <p>Ввійди, щоб зберегти свій капітал</p>
            <input type="email" id="in-email" class="auth-input" placeholder="Електронна пошта">
            <input type="password" id="in-pass" class="auth-input" placeholder="Пароль (6+ символів)">
            <button class="btn-enter" onclick="handleLogin()">ПРИЄДНАТИСЬ</button>
            <div id="err-msg"></div>
        </div>
    </div>

    <div id="app-ui">
        
        <div id="view-game" class="screen-view active">
            <div class="hud-top">
                <p class="badge" id="disp-lvl">RANK: СТАТУС ВАНТАЖИТЬСЯ...</p>
                <div class="xp-container"><div id="xp-bar"></div></div>
                <h1 class="money-text" id="disp-cash">$ 0</h1>
                <p id="disp-pps" style="color: #94a3b8; font-weight: 700;">Дохід: $0/сек</p>
            </div>
            <div class="click-area">
                <div class="main-coin" onclick="triggerTap(event)">B</div>
            </div>
        </div>

        <div id="view-shop" class="screen-view">
            <h2 style="font-family:'Outfit'; font-size: 2rem; margin-bottom: 30px;">МАГАЗИН</h2>
            <div id="shop-content">
                <div class="upgrade-card">
                    <div class="u-info"><h4>Сила кліку</h4><p>+1 до кожного тапу</p></div>
                    <button class="buy-action" id="buy-click" onclick="purchase('click')">$50</button>
                </div>
                <div class="upgrade-card">
                    <div class="u-info"><h4>Вуличний бот</h4><p>+$2 за сек автоматично</p></div>
                    <button class="buy-action" id="buy-bot" onclick="purchase('bot')">$250</button>
                </div>
                <div class="upgrade-card">
                    <div class="u-info"><h4>Офіс у центрі</h4><p>+$15 за сек автоматично</p></div>
                    <button class="buy-action" id="buy-office" onclick="purchase('office')">$1,500</button>
                </div>
            </div>
        </div>

        <div id="view-top" class="screen-view">
            <h2 style="font-family:'Outfit'; font-size: 2rem; margin-bottom: 30px;">FORBES LIST</h2>
            <div class="rank-list" id="leaderboard-data">
                </div>
        </div>

        <nav class="bottom-nav">
            <button class="tab-btn active" onclick="switchView('game')">💰<span>ГРА</span></button>
            <button class="tab-btn" onclick="switchView('shop')">⚡<span>РИНОК</span></button>
            <button class="tab-btn" onclick="switchView('top')">🏆<span>ЛІДЕРИ</span></button>
        </nav>
    </div>

    <script>
        // --- 1. FIREBASE SETUP ---
        const fbConfig = { databaseURL: "https://buiznesimperia-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(fbConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        let game = { m: 0, p: 1, s: 0, l: 1, e: 0 };
        let currentId = null;

        // --- 2. AUTH LOGIC (FIXED) ---
        async function handleLogin() {
            const email = document.getElementById('in-email').value;
            const pass = document.getElementById('in-pass').value;
            const err = document.getElementById('err-msg');

            if (pass.length < 6) { 
                err.style.display = 'block'; 
                err.innerText = "Пароль має бути не менше 6 знаків!"; 
                return; 
            }

            err.style.display = 'block';
            err.style.color = '#3b82f6';
            err.innerText = "З'єднання з базою даних...";

            try {
                // Спроба входу, якщо акаунта нема - реєстрація
                await auth.signInWithEmailAndPassword(email, pass).catch(() => {
                    return auth.createUserWithEmailAndPassword(email, pass);
                });
            } catch (e) {
                err.style.color = '#ff4d4d';
                err.innerText = "Помилка: " + e.message;
            }
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                currentId = user.uid;
                document.getElementById('auth-screen').style.display = 'none';
                const main = document.getElementById('app-ui');
                main.style.display = 'flex';
                setTimeout(() => main.style.opacity = '1', 50);
                
                loadProfile();
                startTimers();
                loadLeaderboard();
            }
        });

        // --- 3. CORE GAMEPLAY ---
        function triggerTap(ev) {
            game.m += game.p;
            game.e += 1;
            
            // Level Up logic
            const needed = game.l * 75;
            if (game.e >= needed) { game.l++; game.e = 0; }
            
            render();
            
            // Visual Effect
            const pop = document.createElement('div');
            pop.className = 'tap-pop';
            pop.style.left = (ev.clientX || ev.touches[0].clientX) + 'px';
            pop.style.top = (ev.clientY || ev.touches[0].clientY) + 'px';
            pop.innerText = `+$${game.p}`;
            document.body.appendChild(pop);
            setTimeout(() => pop.remove(), 750);

            if (navigator.vibrate) navigator.vibrate(12);
        }

        function purchase(type) {
            let price = 0;
            if (type === 'click') {
                price = 50 + (game.p * 45);
                if (game.m >= price) { game.m -= price; game.p += 1; }
            } else if (type === 'bot') {
                price = 250 + (game.s * 60);
                if (game.m >= price) { game.m -= price; game.s += 2; }
            } else if (type === 'office') {
                price = 1500 + (game.s * 100);
                if (game.m >= price) { game.m -= price; game.s += 15; }
            }
            render();
            sync();
        }

        // --- 4. DATA ENGINE ---
        function loadProfile() {
            db.ref('users/' + currentId).on('value', s => {
                const d = s.val();
                if (d) {
                    game.m = d.c || 0;
                    game.p = d.p || 1;
                    game.s = d.s || 0;
                    game.l = d.l || 1;
                    game.e = d.e || 0;
                    render();
                }
            });
        }

        function sync() {
            if (currentId) {
                db.ref('users/' + currentId).update({
                    c: game.m, p: game.p, s: game.s,
                    l: game.l, e: game.e,
                    u: auth.currentUser.email.split('@')[0]
                });
            }
        }

        function startTimers() {
            // Пасивний прибуток кожні 100мс для плавних цифр
            setInterval(() => {
                if (game.s > 0) {
                    game.m += (game.s / 10);
                    render();
                }
            }, 100);
            
            // Авто-сейв кожні 6 секунд
            setInterval(() => sync(), 6000);
        }

        function loadLeaderboard() {
            db.ref('users').orderByChild('c').limitToLast(12).on('value', s => {
                const box = document.getElementById('leaderboard-data');
                box.innerHTML = '';
                let players = [];
                s.forEach(child => players.push(child.val()));
                players.reverse().forEach((p, idx) => {
                    const isMe = p.u === auth.currentUser.email.split('@')[0] ? 'current-user' : '';
                    box.innerHTML += `
                        <div class="user-row ${isMe}">
                            <span>#${idx+1} ${p.u}</span>
                            <b>$${Math.floor(p.c).toLocaleString()}</b>
                        </div>`;
                });
            });
        }

        // --- 5. UI UTILS ---
        function render() {
            document.getElementById('disp-cash').innerText = '$ ' + Math.floor(game.m).toLocaleString();
            document.getElementById('disp-pps').innerText = `Дохід: $${game.s}/сек`;
            
            // Bar calculation
            const pct = (game.e / (game.l * 75)) * 100;
            document.getElementById('xp-bar').style.width = pct + '%';

            // Prices
            document.getElementById('buy-click').innerText = '$' + (50 + (game.p * 45)).toLocaleString();
            document.getElementById('buy-bot').innerText = '$' + (250 + (game.s * 60)).toLocaleString();
            document.getElementById('buy-office').innerText = '$' + (1500 + (game.s * 100)).toLocaleString();

            let title = "HOBO";
            if (game.l > 10) title = "HUSTLER";
            if (game.l > 25) title = "BUSINESSMAN";
            if (game.l > 50) title = "MAGNATE";
            document.getElementById('disp-lvl').innerText = `Lvl ${game.l} | ${title}`;
        }

        function switchView(id) {
            document.querySelectorAll('.screen-view').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('view-' + id).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
