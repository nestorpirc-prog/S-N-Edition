<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BUIZNES IMPERIA | FINAL</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;900&family=Plus+Jakarta+Sans:wght@400;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --p-green: #22c55e; --p-blue: #3b82f6; --bg: #020617; --glass: rgba(255, 255, 255, 0.03); }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body, html { background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; height: 100dvh; width: 100%; overflow: hidden; position: fixed; }

        /* AUTH SCREEN */
        #auth-layer { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 25px; transition: 0.5s; }
        .auth-card { background: var(--glass); width: 100%; max-width: 400px; padding: 40px; border-radius: 40px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(30px); text-align: center; }
        .auth-card h1 { font-family: 'Outfit'; font-size: 2.2rem; margin-bottom: 30px; letter-spacing: -1px; }
        input { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); padding: 18px; border-radius: 20px; color: #fff; margin-bottom: 15px; font-size: 1rem; }
        .auth-btn { width: 100%; background: var(--p-green); color: #000; border: none; padding: 20px; border-radius: 20px; font-weight: 900; font-family: 'Outfit'; font-size: 1.1rem; cursor: pointer; }
        #auth-msg { color: #ef4444; font-size: 0.75rem; margin-top: 15px; min-height: 1.2em; }

        /* MAIN APP */
        #app-shell { display: none; height: 100dvh; flex-direction: column; }
        .screen { display: none; height: 100%; overflow-y: auto; padding: 20px 20px 140px; }
        .screen.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        /* HUD */
        .hud { text-align: center; padding: 30px 0; }
        .money { font-family: 'Outfit'; font-size: 4.8rem; font-weight: 900; letter-spacing: -3px; margin: 5px 0; }
        .lvl-container { width: 140px; height: 6px; background: #1e293b; margin: 10px auto; border-radius: 10px; }
        #lvl-fill { height: 100%; background: var(--p-green); width: 0%; transition: 0.3s; border-radius: 10px; }

        /* CLICKER */
        .click-zone { height: 40vh; display: flex; align-items: center; justify-content: center; }
        .coin { 
            width: 230px; height: 230px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fcd34d, #b45309);
            display: flex; align-items: center; justify-content: center; font-family: 'Outfit'; font-size: 7rem; font-weight: 900; color: #78350f;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5); border: 10px solid #fef3c7; cursor: pointer; transition: 0.05s;
        }
        .coin:active { transform: scale(0.85); }

        /* LISTS */
        .item-card { background: var(--glass); padding: 20px; border-radius: 25px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .buy-btn { background: var(--p-blue); color: #fff; border: none; padding: 12px 18px; border-radius: 15px; font-weight: 900; }
        .rank-row { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        /* NAV */
        .nav { position: fixed; bottom: 0; width: 100%; background: rgba(2,6,23,0.9); backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-around; padding: 15px 10px 45px; }
        .nav-t { background: none; border: none; color: #64748b; font-weight: 900; font-size: 0.65rem; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .nav-t.active { color: var(--p-green); }

        .fx { position: fixed; color: var(--p-green); font-weight: 900; font-size: 2rem; pointer-events: none; animation: up 0.8s forwards; }
        @keyframes up { to { transform: translateY(-150px); opacity: 0; } }
    </style>
</head>
<body>

    <div id="auth-layer">
        <div class="auth-card">
            <h1>BUIZNES ENTRY</h1>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="pass" placeholder="Пароль">
            <button class="auth-btn" onclick="startApp()">УВІЙТИ В ІМПЕРІЮ</button>
            <p id="auth-msg"></p>
        </div>
    </div>

    <div id="app-shell">
        <div id="game" class="screen active">
            <div class="hud">
                <p id="txt-lvl" style="font-weight: 800; font-size: 0.7rem; color: var(--p-blue);">LEVEL 1 | HOBO</p>
                <div class="lvl-container"><div id="lvl-fill"></div></div>
                <h1 class="money" id="txt-cash">$ 0</h1>
                <p id="txt-pps" style="font-size: 0.8rem; color: #94a3b8;">Дохід: $0/сек</p>
            </div>
            <div class="click-zone"><div class="coin" onclick="tap(event)">B</div></div>
        </div>

        <div id="shop" class="screen">
            <h2 style="margin-bottom: 20px;">МАГАЗИН</h2>
            <div id="shop-items">
                <div class="item-card">
                    <div><h4>Сила кліку</h4><p>+1 до прибутку</p></div>
                    <button class="buy-btn" id="btn-click" onclick="buy('click')">$50</button>
                </div>
                <div class="item-card">
                    <div><h4>Авто-клікер</h4><p>+$2/сек</p></div>
                    <button class="buy-btn" id="btn-pps" onclick="buy('pps')">$250</button>
                </div>
            </div>
        </div>

        <div id="top" class="screen">
            <h2 style="margin-bottom: 20px;">ТОП ІМПЕРІЙ</h2>
            <div id="top-list"></div>
        </div>

        <nav class="nav">
            <button class="nav-t active" onclick="nav('game')">💰<span>ГРА</span></button>
            <button class="nav-t" onclick="nav('shop')">⚡<span>МАГАЗИН</span></button>
            <button class="nav-t" onclick="nav('top')">🏆<span>ТОП</span></button>
        </nav>
    </div>

    <script>
        // Ініціалізація відкладена до натискання кнопки
        const fbConfig = { databaseURL: "https://buiznesimperia-default-rtdb.firebaseio.com/" };
        let db, auth;

        let state = { cash: 0, power: 1, pps: 0, lvl: 1, exp: 0 };
        let uid = null;

        async function startApp() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            const msg = document.getElementById('auth-msg');

            if (p.length < 6) { msg.innerText = "Пароль має бути від 6 символів"; return; }

            // ПРЯМА ІНІЦІАЛІЗАЦІЯ ПЕРЕД ВИКОРИСТАННЯМ
            if (!firebase.apps.length) firebase.initializeApp(fbConfig);
            db = firebase.database();
            auth = firebase.auth();

            msg.innerText = "Авторизація...";
            try {
                await auth.signInWithEmailAndPassword(e, p).catch(() => auth.createUserWithEmailAndPassword(e, p));
            } catch (err) {
                msg.innerText = err.message;
            }
        }

        firebase.auth().onAuthStateChanged(user => {
            if (user) {
                uid = user.uid;
                document.getElementById('auth-layer').style.display = 'none';
                document.getElementById('app-shell').style.display = 'flex';
                initGame();
            }
        });

        function tap(e) {
            state.cash += state.power;
            state.exp += 1;
            if (state.exp >= state.lvl * 50) { state.lvl++; state.exp = 0; }
            updateUI();
            
            const f = document.createElement('div'); f.className = 'fx';
            f.style.left = (e.clientX || e.touches[0].clientX) + 'px';
            f.style.top = (e.clientY || e.touches[0].clientY) + 'px';
            f.innerText = `+$${state.power}`; document.body.appendChild(f);
            setTimeout(() => f.remove(), 800);
            if (navigator.vibrate) navigator.vibrate(10);
        }

        function buy(t) {
            let cost = t === 'click' ? 50 + (state.power * 40) : 250 + (state.pps * 70);
            if (state.cash >= cost) {
                state.cash -= cost;
                if (t === 'click') state.power++; else state.pps += 2;
                updateUI(); save();
            }
        }

        function initGame() {
            db.ref('users/' + uid).on('value', s => {
                const d = s.val();
                if (d) { state.cash = d.c; state.power = d.p; state.pps = d.s; state.lvl = d.l; state.exp = d.e; updateUI(); }
            });
            setInterval(() => { if (state.pps > 0) { state.cash += state.pps/10; updateUI(); } }, 100);
            setInterval(() => save(), 5000);
            syncTop();
        }

        function save() {
            if (uid) db.ref('users/' + uid).update({ c: state.cash, p: state.power, s: state.pps, l: state.lvl, e: state.exp, u: auth.currentUser.email.split('@')[0] });
        }

        function syncTop() {
            db.ref('users').orderByChild('c').limitToLast(10).on('value', s => {
                const l = document.getElementById('top-list'); l.innerHTML = '';
                let arr = []; s.forEach(x => arr.push(x.val()));
                arr.reverse().forEach((u, i) => {
                    l.innerHTML += `<div class="rank-row"><span>#${i+1} ${u.u}</span><b>$${Math.floor(u.c).toLocaleString()}</b></div>`;
                });
            });
        }

        function updateUI() {
            document.getElementById('txt-cash').innerText = '$ ' + Math.floor(state.cash).toLocaleString();
            document.getElementById('txt-pps').innerText = `Дохід: $${state.pps}/сек`;
            document.getElementById('lvl-fill').style.width = (state.exp / (state.lvl * 50)) * 100 + '%';
            document.getElementById('txt-lvl').innerText = `LEVEL ${state.lvl} | ${state.cash > 10000 ? 'TYCOON' : 'HOBO'}`;
            document.getElementById('btn-click').innerText = '$' + (50 + (state.power * 40));
            document.getElementById('btn-pps').innerText = '$' + (250 + (state.pps * 70));
        }

        function nav(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-t').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
