<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BUIZNES IMPERIA | NESTOR & SANYA</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;900&family=Plus+Jakarta+Sans:wght@400;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --p-green: #22c55e; --p-blue: #3b82f6; --bg: #020617; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body, html { 
            background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; 
            height: 100dvh; width: 100%; overflow: hidden; position: fixed; 
        }

        /* --- AUTH INTERFACE --- */
        #auth-screen { 
            position: fixed; inset: 0; background: var(--bg); z-index: 9999; 
            display: flex; flex-direction: column; justify-content: center; padding: 30px; 
        }
        .auth-box { 
            background: rgba(255,255,255,0.03); padding: 40px; border-radius: 40px; 
            border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(20px); 
            text-align: center;
        }
        .auth-box h1 { font-family: 'Outfit'; font-size: 2rem; margin-bottom: 25px; }
        input { 
            width: 100%; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); 
            padding: 20px; border-radius: 20px; color: #fff; margin-bottom: 15px; font-size: 1rem; outline: none;
        }
        .btn-enter { 
            width: 100%; background: var(--p-green); color: #000; border: none; 
            padding: 22px; border-radius: 20px; font-weight: 900; font-family: 'Outfit'; 
            font-size: 1.2rem; cursor: pointer; transition: 0.2s;
        }
        .btn-enter:disabled { opacity: 0.5; }
        #err-log { color: #ef4444; font-size: 0.7rem; margin-top: 15px; min-height: 1em; }

        /* --- MAIN APP --- */
        #main-wrapper { display: none; height: 100dvh; flex-direction: column; }
        .screen { display: none; height: 100%; overflow-y: auto; padding: 25px 25px 150px; }
        .screen.active { display: block; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* --- GAME UI --- */
        .header-stats { text-align: center; padding: 40px 0 20px; }
        .balance-main { font-family: 'Outfit'; font-size: 5rem; font-weight: 900; letter-spacing: -3px; line-height: 1; margin: 10px 0; }
        .rank-badge { color: var(--p-green); font-weight: 800; font-size: 0.7rem; letter-spacing: 4px; text-transform: uppercase; }
        
        .clicker-container { height: 45vh; display: flex; align-items: center; justify-content: center; }
        .master-coin { 
            width: 240px; height: 240px; border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fbbf24, #b45309);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Outfit'; font-size: 7rem; font-weight: 900; color: #78350f;
            box-shadow: 0 30px 70px rgba(0,0,0,0.6), inset 0 0 50px rgba(255,255,255,0.2);
            border: 10px solid #fef3c7; cursor: pointer; transition: 0.05s;
        }
        .master-coin:active { transform: scale(0.88); }

        /* --- LISTS (SHOP/TOP) --- */
        .card-item { 
            background: rgba(255,255,255,0.03); padding: 20px; border-radius: 25px; 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.05);
        }
        .buy-action { background: var(--p-blue); color: #fff; border: none; padding: 12px 20px; border-radius: 15px; font-weight: 900; font-size: 0.8rem; }
        .leader-row { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }

        /* --- NAV --- */
        .nav-bar { 
            position: fixed; bottom: 0; width: 100%; background: rgba(2,6,23,0.95); 
            backdrop-filter: blur(25px); border-top: 1px solid rgba(255,255,255,0.1); 
            display: flex; justify-content: space-around; padding: 15px 10px 45px; 
        }
        .nav-btn { background: none; border: none; color: #64748b; font-weight: 900; font-size: 0.65rem; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .nav-btn.active { color: var(--p-green); }

        /* EFFECTS */
        .tap-fx { position: fixed; color: var(--p-green); font-weight: 900; font-size: 2.2rem; pointer-events: none; animation: tapMove 0.8s forwards; z-index: 9999; }
        @keyframes tapMove { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-150px) scale(1.5); } }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-box">
            <h1>BUIZNES ENTRY</h1>
            <input type="email" id="inp-email" placeholder="Email (any email)">
            <input type="password" id="inp-pass" placeholder="Password (6+ chars)">
            <button class="btn-enter" id="btn-login" onclick="handleAuth()">ACCESS DATABASE</button>
            <p id="err-log"></p>
        </div>
    </div>

    <div id="main-wrapper">
        
        <div id="scr-game" class="screen active">
            <div class="header-stats">
                <p class="rank-badge" id="txt-rank">RANK: INITIALIZING</p>
                <h1 class="balance-main" id="txt-cash">$ 0</h1>
                <p style="font-size: 0.8rem; color: #94a3b8;" id="txt-pps">Passive: $0/sec</p>
            </div>
            <div class="clicker-container">
                <div class="master-coin" onclick="performTap(event)">B</div>
            </div>
        </div>

        <div id="scr-shop" class="screen">
            <h2 style="font-family:'Outfit'; margin-bottom: 25px;">BLACK MARKET</h2>
            <div id="shop-container">
                <div class="card-item">
                    <div><h4>Hustler Grip</h4><p style="font-size: 0.7rem; color: #94a3b8;">+1 per click</p></div>
                    <button class="buy-action" id="btn-up-click" onclick="buyItem('click')">$50</button>
                </div>
                <div class="card-item">
                    <div><h4>Auto-Bot V1</h4><p style="font-size: 0.7rem; color: #94a3b8;">+$2 per sec</p></div>
                    <button class="buy-action" id="btn-up-pps" onclick="buyItem('pps')">$250</button>
                </div>
            </div>
        </div>

        <div id="scr-top" class="screen">
            <h2 style="font-family:'Outfit'; margin-bottom: 25px;">GLOBAL TOP 10</h2>
            <div id="top-list"></div>
        </div>

        <nav class="nav-bar">
            <button class="nav-btn active" onclick="switchTab('game')">💰<span>EMPIRE</span></button>
            <button class="nav-btn" onclick="switchTab('shop')">⚡<span>SHOP</span></button>
            <button class="nav-btn" onclick="switchTab('top')">🏆<span>TOP</span></button>
        </nav>
    </div>

    <script>
        // --- 1. FIREBASE SETUP ---
        const firebaseConfig = { databaseURL: "https://buiznesimperia-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        
        const db = firebase.database();
        const auth = firebase.auth();

        let state = { cash: 0, power: 1, pps: 0 };
        let currentUid = null;

        // --- 2. AUTH ENGINE (STABLE) ---
        async function handleAuth() {
            const email = document.getElementById('inp-email').value;
            const pass = document.getElementById('inp-pass').value;
            const btn = document.getElementById('btn-login');
            const err = document.getElementById('err-log');

            if (!email || pass.length < 6) { err.innerText = "Invalid data (Password 6+ chars)"; return; }
            
            btn.disabled = true;
            err.innerText = "Syncing with cloud...";

            try {
                // Спершу логін, якщо ні — реєстрація
                await auth.signInWithEmailAndPassword(email, pass).catch(() => {
                    return auth.createUserWithEmailAndPassword(email, pass);
                });
            } catch (e) {
                err.innerText = e.message;
                btn.disabled = false;
            }
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUid = user.uid;
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('main-wrapper').style.display = 'flex';
                
                loadCloudData();
                startHeartbeat();
                initLeaderboard();
            }
        });

        // --- 3. CORE GAMEPLAY ---
        function performTap(e) {
            state.cash += state.power;
            refreshUI();
            
            // Visual FX
            const fx = document.createElement('div');
            fx.className = 'tap-fx';
            fx.style.left = (e.clientX || e.touches[0].clientX) + 'px';
            fx.style.top = (e.clientY || e.touches[0].clientY) + 'px';
            fx.innerText = `+$${state.power}`;
            document.body.appendChild(fx);
            setTimeout(() => fx.remove(), 700);

            if (navigator.vibrate) navigator.vibrate(12);
        }

        function buyItem(type) {
            let cost = 0;
            if (type === 'click') {
                cost = 50 + (state.power * 40);
                if (state.cash >= cost) { state.cash -= cost; state.power++; }
            } else {
                cost = 250 + (state.pps * 80);
                if (state.cash >= cost) { state.cash -= cost; state.pps += 2; }
            }
            refreshUI();
            pushToCloud();
        }

        // --- 4. DATA SYNC ---
        function loadCloudData() {
            db.ref('users/' + currentUid).on('value', snap => {
                const data = snap.val();
                if (data) {
                    state.cash = data.c || 0;
                    state.power = data.p || 1;
                    state.pps = data.s || 0;
                    refreshUI();
                }
            });
        }

        function pushToCloud() {
            if (currentUid) {
                db.ref('users/' + currentUid).update({
                    c: state.cash,
                    p: state.power,
                    s: state.pps,
                    u: auth.currentUser.email.split('@')[0],
                    t: Date.now()
                });
            }
        }

        function startHeartbeat() {
            // Пасивний прибуток кожні 100мс
            setInterval(() => {
                if (state.pps > 0) {
                    state.cash += (state.pps / 10);
                    refreshUI();
                }
            }, 100);
            
            // Авто-збереження кожні 4 сек
            setInterval(() => pushToCloud(), 4000);
        }

        function initLeaderboard() {
            db.ref('users').orderByChild('c').limitToLast(10).on('value', snap => {
                const list = document.getElementById('top-list');
                list.innerHTML = '';
                let players = [];
                snap.forEach(child => players.push(child.val()));
                players.reverse().forEach((p, i) => {
                    list.innerHTML += `
                        <div class="leader-row">
                            <span>#${i+1} ${p.u}</span>
                            <b>$${Math.floor(p.c).toLocaleString()}</b>
                        </div>`;
                });
            });
        }

        // --- 5. INTERFACE UTILS ---
        function refreshUI() {
            document.getElementById('txt-cash').innerText = '$ ' + Math.floor(state.cash).toLocaleString();
            document.getElementById('txt-pps').innerText = `Passive: $${state.pps}/sec`;
            
            // Оновлення цін в магазині
            document.getElementById('btn-up-click').innerText = '$' + (50 + (state.power * 40)).toLocaleString();
            document.getElementById('btn-up-pps').innerText = '$' + (250 + (state.pps * 80)).toLocaleString();

            let rank = "HOBO";
            if (state.cash > 10000) rank = "STREET LEGEND";
            if (state.cash > 100000) rank = "CEO OF IMPERIA";
            document.getElementById('txt-rank').innerText = "RANK: " + rank;
        }

        function switchTab(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('scr-' + id).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
