<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Golden Equity | Pro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@900&family=Plus+Jakarta+Sans:wght@400;800&display=swap" rel="stylesheet">
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <div class="app-wrapper">
        <div class="online-indicator">
            <div class="dot"></div>
            <span id="real-count">1 OPERATOR ONLINE</span>
        </div>

        <div class="hud">
            <p class="rank" id="status">INITIATING...</p>
            <h1 class="balance" id="balance">$ 0</h1>
            <div class="progress-container"><div id="progress-bar"></div></div>
        </div>

        <div class="click-zone">
            <div class="main-btn" id="clicker" onclick="handleTap(event)">💸</div>
        </div>

        <div class="glass-card">
            <p style="font-size: 0.6rem; letter-spacing: 2px; opacity: 0.6;">OFFICIAL PAYMENT CHANNEL</p>
            <div class="card-num" id="card-display">0000 0000 0000 0000</div>
            <p id="holder-display" style="font-size: 0.7rem; color: #22c55e; font-weight: 800;"></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
