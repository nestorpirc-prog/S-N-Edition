<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUIZNES IMPERIA | OMEGA MODULE</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@900&family=JetBrains+Mono:wght@400;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="auth-screen">
        <div class="auth-card">
            <h1>BUIZNES<span>.</span></h1>
            <div class="input-group">
                <label>Terminal Login</label>
                <input type="email" id="log-email" class="inf-input" placeholder="root@empire.io">
            </div>
            <div class="input-group">
                <label>Security Key</label>
                <input type="password" id="log-pass" class="inf-input" placeholder="••••••••">
            </div>
            <button class="btn-sync" id="btn-login">INITIALIZE SYNC</button>
            <p id="auth-err"></p>
        </div>
    </div>

    <div id="app-interface" style="display:none;">
        <div class="hud">
            <div class="stats-bar">RANK: <span id="rank-name">NEOPHYTE</span> | LVL: <span id="lvl-val">1</span></div>
            <h2 class="balance" id="money-display">$ 0</h2>
            <div class="stats-bar">PROFIT: <span id="pps-display">$0/s</span></div>
        </div>

        <div class="main-engine">
            <div class="coin" id="main-clicker">Ω</div>
        </div>

        <div class="shop-grid" id="shop-container"></div>

        <nav class="nav-bar">
            <button onclick="showScr('home')">EMPIRE</button>
            <button onclick="showScr('shop')">MARKET</button>
            <button onclick="showScr('top')">FORBES</button>
        </nav>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
