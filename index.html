<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BUIZNES IMPERIA | CORE</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@900&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="scanner-line"></div>

    <div id="auth-screen">
        <div class="terminal-card">
            <div class="status-dot"></div>
            <h1>BUIZNES<span>.</span></h1>
            <p class="tagline">ENCRYPTED IMPERIAL TERMINAL</p>
            
            <div class="input-field">
                <label>USER_ID</label>
                <input type="email" id="email" placeholder="admin@imperia.io" value="nestorpirc@gmail.com">
            </div>
            
            <div class="input-field">
                <label>ACCESS_KEY</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            
            <button id="auth-btn" class="main-btn">ESTABLISH_LINK</button>
            <div id="auth-status"></div>
        </div>
    </div>

    <div id="game-ui" style="display: none;">
        <header class="stats-header">
            <div class="rank-container">
                <span class="label">STATUS:</span>
                <span id="rank-display">LOADING...</span>
            </div>
            <div class="main-balance">
                <span class="currency">$</span><span id="money">0</span>
            </div>
            <div class="sub-stats">
                <div>PROFIT: <span id="pps">$0</span>/s</div>
                <div>EXP: <span id="lvl">1</span></div>
            </div>
        </header>

        <main class="action-zone">
            <div id="clicker-core" class="orb">
                <div class="inner-glow"></div>
                <span class="symbol">Ω</span>
            </div>
        </main>

        <section id="shop-view" class="panel">
            <h2 class="panel-title">BLACK MARKET</h2>
            <div id="items-grid" class="grid"></div>
        </section>

        <section id="top-view" class="panel" style="display:none;">
            <h2 class="panel-title">GLOBAL ELITE</h2>
            <div id="leaderboard" class="list"></div>
        </section>

        <nav class="bottom-nav">
            <button onclick="showTab('home')" class="nav-item active">MAIN</button>
            <button onclick="showTab('shop')" class="nav-item">MARKET</button>
            <button onclick="showTab('top')" class="nav-item">FORBES</button>
        </nav>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
