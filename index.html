<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BUIZNES IMPERIA | INFERNO OMEGA ULTIMATE</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;400;900&family=JetBrains+Mono:wght@300;800&family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- CORE STYLES & VARIABLES --- */
        :root {
            --fire-main: #ff4d00;
            --fire-glow: #ffae00;
            --magma: #8b0000;
            --void: #020204;
            --glass-border: rgba(255, 77, 0, 0.2);
            --font-logo: 'Outfit', sans-serif;
            --font-tech: 'JetBrains Mono', monospace;
            --font-main: 'Space Grotesk', sans-serif;
            --anim-speed: 0.4s;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body, html { 
            background: var(--void); 
            color: #fff; 
            font-family: var(--font-main);
            height: 100dvh; 
            width: 100%; 
            overflow: hidden; 
            position: fixed;
        }

        /* --- BACKGROUND ENGINE --- */
        #particle-canvas {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: radial-gradient(circle at center, #150505 0%, #020204 100%);
        }

        .scanline {
            width: 100%;
            height: 100px;
            z-index: 1000;
            background: linear-gradient(0deg, transparent 0%, rgba(255, 77, 0, 0.05) 50%, transparent 100%);
            opacity: 0.1;
            position: absolute;
            bottom: 100%;
            animation: scan 4s linear infinite;
            pointer-events: none;
        }

        @keyframes scan { 0% { bottom: 100%; } 100% { bottom: -100px; } }

        /* --- AUTH LAYER --- */
        #auth-layer {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(10px);
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .auth-container {
            width: 100%;
            max-width: 450px;
            background: rgba(5, 5, 10, 0.95);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 60px 40px;
            text-align: center;
            box-shadow: 0 0 100px rgba(255, 77, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .auth-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 180deg at 50% 50%, transparent 0deg, var(--fire-main) 360deg);
            animation: rotateGlow 15s linear infinite;
            opacity: 0.05;
            z-index: -1;
        }

        @keyframes rotateGlow { 100% { transform: rotate(360deg); } }

        .logo-box h1 {
            font-family: var(--font-logo);
            font-size: 5rem;
            font-weight: 900;
            letter-spacing: -5px;
            line-height: 0.8;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .logo-box p {
            color: var(--fire-glow);
            font-family: var(--font-tech);
            font-size: 0.75rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 50px;
        }

        .input-wrapper {
            text-align: left;
            margin-bottom: 30px;
        }

        .input-wrapper label {
            display: block;
            font-family: var(--font-tech);
            font-size: 0.65rem;
            color: #666;
            margin-left: 20px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .inferno-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 22px 25px;
            color: #fff;
            font-size: 1rem;
            font-family: var(--font-tech);
            transition: 0.3s;
        }

        .inferno-input:focus {
            border-color: var(--fire-main);
            background: rgba(255, 77, 0, 0.05);
            outline: none;
            box-shadow: 0 0 20px rgba(255, 77, 0, 0.1);
        }

        .main-btn {
            width: 100%;
            background: var(--fire-main);
            color: #000;
            border: none;
            border-radius: 25px;
            padding: 25px;
            font-family: var(--font-logo);
            font-weight: 900;
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.4s;
            position: relative;
            overflow: hidden;
            margin-top: 20px;
        }

        .main-btn:active { transform: scale(0.96); }
        .main-btn span { position: relative; z-index: 2; }

        .error-msg {
            margin-top: 25px;
            font-family: var(--font-tech);
            font-size: 0.7rem;
            color: var(--fire-main);
            min-height: 20px;
            text-transform: uppercase;
        }

        /* --- GAME INTERFACE --- */
        #root-app {
            display: none;
            flex-direction: column;
            height: 100vh;
            opacity: 0;
            transition: 1.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .top-hud {
            padding: 50px 30px 20px;
            text-align: center;
        }

        .rank-pill {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 6px 15px;
            border-radius: 100px;
            font-size: 0.6rem;
            font-weight: 900;
            color: var(--fire-glow);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .main-balance {
            font-family: var(--font-logo);
            font-size: 6rem;
            font-weight: 900;
            letter-spacing: -6px;
            margin: 15px 0;
            line-height: 0.8;
            text-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .mining-rate {
            font-family: var(--font-tech);
            font-size: 0.85rem;
            color: #666;
        }

        .xp-container {
            width: 250px;
            margin: 30px auto;
        }

        .xp-track {
            height: 3px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .xp-bar {
            height: 100%;
            background: var(--fire-main);
            width: 0%;
            box-shadow: 0 0 15px var(--fire-main);
            transition: 0.4s;
        }

        /* CLICK ENGINE */
        .clicker-view {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .omega-coin {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ff8c00, #ff4500, #410);
            border: 15px solid rgba(255,255,255,0.9);
            box-shadow: 0 60px 100px rgba(0,0,0,0.8), inset 0 0 60px rgba(0,0,0,0.6);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-logo);
            font-size: 10rem;
            font-weight: 900;
            color: rgba(0,0,0,0.3);
            transition: 0.05s;
            z-index: 10;
        }

        .omega-coin:active {
            transform: scale(0.85) rotate(-5deg);
            filter: brightness(1.2);
        }

        /* --- SCREENS & CARDS --- */
        .screen {
            display: none;
            height: 100%;
            overflow-y: auto;
            padding: 20px 25px 200px;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.6s forwards;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .card {
            background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 35px;
            padding: 25px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-info h3 { font-family: var(--font-logo); font-size: 1.5rem; margin-bottom: 5px; }
        .card-info p { font-size: 0.8rem; color: #777; font-family: var(--font-tech); }

        .buy-trigger {
            background: #fff;
            color: #000;
            border: none;
            padding: 18px 25px;
            border-radius: 18px;
            font-weight: 900;
            font-family: var(--font-tech);
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .buy-trigger.locked { opacity: 0.2; filter: grayscale(1); }

        /* NAVIGATION */
        .nav-dock {
            position: fixed;
            bottom: 0;
            width: 100%;
            padding: 30px 20px 50px;
            background: linear-gradient(0deg, var(--void) 70%, transparent 100%);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            z-index: 1000;
        }

        .nav-item {
            background: none;
            border: none;
            color: #444;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            font-size: 0.65rem;
            font-weight: 900;
            text-transform: uppercase;
            font-family: var(--font-tech);
            transition: 0.3s;
        }

        .nav-item.active { color: var(--fire-main); transform: translateY(-5px); }

        /* FX */
        .floating-val {
            position: fixed;
            pointer-events: none;
            color: var(--fire-glow);
            font-family: var(--font-logo);
            font-weight: 900;
            font-size: 4rem;
            animation: floatAway 1.2s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
            z-index: 100;
            text-shadow: 0 0 30px rgba(255, 77, 0, 0.5);
        }

        @keyframes floatAway {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-300px) scale(2); }
        }

        #notification {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            color: #000;
            padding: 12px 30px;
            border-radius: 100px;
            font-weight: 900;
            font-size: 0.8rem;
            z-index: 10001;
            display: none;
        }
    </style>
</head>
<body>

    <canvas id="particle-canvas"></canvas>
    <div class="scanline"></div>
    <div id="notification">СИСТЕМА СИНХРОНІЗОВАНА</div>

    <div id="auth-layer">
        <div class="auth-container">
            <div class="logo-box">
                <h1>BUIZNES</h1>
                <p>Inferno Omega v6.6.6</p>
            </div>

            <div class="input-wrapper">
                <label>Terminal Login</label>
                <input type="email" id="email-in" class="inferno-input" placeholder="root@imperia.io" autocomplete="off">
            </div>

            <div class="input-wrapper">
                <label>Access Key</label>
                <input type="password" id="pass-in" class="inferno-input" placeholder="••••••••" autocomplete="off">
            </div>

            <button class="main-btn" onclick="initInfernoSync()">
                <span>INITIALIZE SYNC</span>
            </button>

            <div id="error-log" class="error-msg"></div>
        </div>
    </div>

    <div id="root-app">
        <div id="view-home" class="screen active">
            <div class="top-hud">
                <span class="rank-pill" id="display-rank">Initializing...</span>
                <h2 class="main-balance" id="display-money">$ 0</h2>
                <div class="mining-rate" id="display-pps">Mining: $0.00/s</div>
                
                <div class="xp-container">
                    <div class="xp-track"><div id="xp-bar" class="xp-bar"></div></div>
                </div>
            </div>

            <div class="clicker-view">
                <div class="omega-coin" onclick="handleTap(event)">Ω</div>
            </div>
        </div>

        <div id="view-shop" class="screen">
            <h2 style="font-family: var(--font-logo); font-size: 3.5rem; margin-bottom: 40px; letter-spacing: -3px;">MARKET</h2>
            <div id="shop-items"></div>
        </div>

        <div id="view-top" class="screen">
            <h2 style="font-family: var(--font-logo); font-size: 3.5rem; margin-bottom: 40px; letter-spacing: -3px;">FORBES</h2>
            <div id="leaderboard-list"></div>
        </div>

        <nav class="nav-dock">
            <button class="nav-item active" onclick="switchTab('home')">Empire</button>
            <button class="nav-item" onclick="switchTab('shop')">Market</button>
            <button class="nav-item" onclick="switchTab('top')">Ranks</button>
        </nav>
    </div>

    <script>
        /* --- FIREBASE CONFIG (ВСТАВ СВОЄ) --- */
        // Обов'язково встав apiKey зі свого проекту Firebase!
        const firebaseConfig = {
            apiKey: "AIzaSyB...", // Твій ключ тут
            databaseURL: "https://buiznesimperia-default-rtdb.firebaseio.com/"
        };

        let state = {
            money: 0, power: 1, pps: 0,
            lvl: 1, exp: 0, uid: null,
            email: '', name: 'Ghost',
            ready: false
        };

        const SHOP_DATA = [
            { id: 't1', name: 'Inferno Core', d: 'Click x2', base: 50, m: 2.2, v: 2, t: 'p' },
            { id: 's1', name: 'Neural Bot', d: '+$10/s', base: 500, m: 1.6, v: 10, t: 's' },
            { id: 's2', name: 'Shell Corp', d: '+$80/s', base: 4500, m: 1.7, v: 80, t: 's' },
            { id: 's3', name: 'Swiss Bank', d: '+$450/s', base: 38000, m: 1.8, v: 450, t: 's' },
            { id: 's4', name: 'Omega AI', d: '+$6k/s', base: 450000, m: 1.9, v: 6000, t: 's' }
        ];

        /* --- SYNC ENGINE (ПОЧИНЕНО) --- */
        function initInfernoSync() {
            const e = document.getElementById('email-in').value;
            const p = document.getElementById('pass-in').value;
            const log = document.getElementById('error-log');

            if (e.length < 5 || p.length < 6) {
                log.innerText = "PROTOCOL ERROR: INVALID CREDENTIALS";
                return;
            }

            // Ініціалізуємо Firebase тільки тут, щоб уникнути помилок черговості
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }

            log.innerText = "BYPASSING FIREWALL... ESTABLISHING SYNC";

            firebase.auth().signInWithEmailAndPassword(e, p)
                .catch(() => firebase.auth().createUserWithEmailAndPassword(e, p))
                .catch(err => {
                    log.innerText = "SYNC FAIL: " + err.message;
                });
        }

        firebase.auth().onAuthStateChanged(u => {
            if (u) {
                state.uid = u.uid;
                state.email = u.email;
                state.name = u.email.split('@')[0];
                launchApplication();
            }
        });

        function launchApplication() {
            const auth = document.getElementById('auth-layer');
            auth.style.opacity = '0';
            setTimeout(() => auth.style.display = 'none', 1000);

            const root = document.getElementById('root-app');
            root.style.display = 'flex';
            setTimeout(() => root.style.opacity = '1', 500);

            // Connect Database
            firebase.database().ref('users/' + state.uid).on('value', s => {
                const d = s.val();
                if (d) {
                    state.money = d.m || 0;
                    state.power = d.p || 1;
                    state.pps = d.s || 0;
                    state.lvl = d.l || 1;
                    state.exp = d.e || 0;
                    updateUI();
                }
            });

            renderMarket();
            syncLeaderboard();
            
            // Loop Engines
            setInterval(() => {
                if (state.pps > 0) {
                    state.money += (state.pps / 10);
                    updateUI();
                }
            }, 100);

            setInterval(saveCloud, 10000);
            state.ready = true;
        }

        /* --- GAME LOGIC --- */
        function handleTap(ev) {
            state.money += state.power;
            state.exp += 1;

            const nextXp = state.lvl * 200;
            if (state.exp >= nextXp) {
                state.lvl++;
                state.exp = 0;
                notify("LEVEL UP: " + state.lvl);
                if (navigator.vibrate) navigator.vibrate([50, 30, 50]);
            }

            spawnFX(ev);
            updateUI();
            if (navigator.vibrate) navigator.vibrate(20);
        }

        function renderMarket() {
            const cont = document.getElementById('shop-items');
            cont.innerHTML = '';
            SHOP_DATA.forEach(item => {
                cont.innerHTML += `
                    <div class="card">
                        <div class="card-info">
                            <h3>${item.name}</h3>
                            <p>${item.d}</p>
                        </div>
                        <button class="buy-trigger" id="btn-${item.id}" onclick="buyItem('${item.id}')">$0</button>
                    </div>
                `;
            });
        }

        function buyItem(id) {
            const it = SHOP_DATA.find(x => x.id === id);
            let cost = 0;
            
            if (it.t === 'p') cost = Math.floor(it.base * Math.pow(it.m, Math.log2(state.power)));
            else cost = Math.floor(it.base * Math.pow(it.m, (state.pps / it.v)));

            if (state.money >= cost) {
                state.money -= cost;
                if (it.t === 'p') state.power *= it.v;
                else state.pps += it.v;
                updateUI();
                saveCloud();
            }
        }

        function updateUI() {
            document.getElementById('display-money').innerText = '$' + Math.floor(state.money).toLocaleString();
            document.getElementById('display-pps').innerText = `Mining: $${state.pps.toFixed(2)}/s`;
            
            const xpPct = (state.exp / (state.lvl * 200)) * 100;
            document.getElementById('xp-bar').style.width = xpPct + '%';

            // Prices
            SHOP_DATA.forEach(it => {
                let cost = 0;
                if (it.t === 'p') cost = Math.floor(it.base * Math.pow(it.m, Math.log2(state.power)));
                else cost = Math.floor(it.base * Math.pow(it.m, (state.pps / it.v)));
                
                const btn = document.getElementById('btn-' + it.id);
                if (btn) {
                    btn.innerText = '$' + cost.toLocaleString();
                    btn.className = state.money >= cost ? 'buy-trigger' : 'buy-trigger locked';
                }
            });

            // Rank
            let r = "HOBO";
            if (state.lvl > 10) r = "STREET DEALER";
            if (state.lvl > 30) r = "SHADOW CEO";
            if (state.lvl > 100) r = "OMEGA LORD";
            document.getElementById('display-rank').innerText = r;
        }

        /* --- CLOUD SYNC --- */
        function saveCloud() {
            if (!state.uid) return;
            firebase.database().ref('users/' + state.uid).update({
                m: state.money, p: state.power, s: state.pps,
                l: state.lvl, e: state.exp, u: state.name
            });
            showNotify("CLOUD SYNC OK");
        }

        function syncLeaderboard() {
            firebase.database().ref('users').orderByChild('m').limitToLast(10).on('value', s => {
                const list = document.getElementById('leaderboard-list');
                list.innerHTML = '';
                let ranks = [];
                s.forEach(c => ranks.push(c.val()));
                ranks.reverse().forEach((u, i) => {
                    list.innerHTML += `
                        <div class="card">
                            <div class="card-info">
                                <h3>#${i+1} ${u.u}</h3>
                                <p>Empire Value</p>
                            </div>
                            <div style="font-weight: 900; color: var(--fire-glow)">$${Math.floor(u.m).toLocaleString()}</div>
                        </div>
                    `;
                });
            });
        }

        /* --- UTILS & VISUALS --- */
        function spawnFX(e) {
            const t = document.createElement('div');
            t.className = 'floating-val';
            const x = e.clientX || e.touches[0].clientX;
            const y = e.clientY || e.touches[0].clientY;
            t.style.left = x + 'px';
            t.style.top = y + 'px';
            t.innerText = `+$${state.power}`;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 1100);
        }

        function switchTab(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('view-' + id).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function showNotify(txt) {
            const n = document.getElementById('notification');
            n.innerText = txt;
            n.style.display = 'block';
            setTimeout(() => n.style.display = 'none', 2000);
        }

        /* --- CANVAS PARTICLES --- */
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let parts = [];
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speed = Math.random() * 1 + 0.2;
                this.alpha = Math.random() * 0.5;
            }
            draw() {
                ctx.fillStyle = `rgba(255, 77, 0, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
                ctx.fill();
                this.y -= this.speed;
                if (this.y < -10) this.y = canvas.height + 10;
            }
        }
        for(let i=0; i<60; i++) parts.push(new Particle());
        function anim() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            parts.forEach(p => p.draw());
            requestAnimationFrame(anim);
        }
        anim();
    </script>
</body>
</html>
