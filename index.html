<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUIZNES IMPERIA | INFERNO OMEGA</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@900&family=JetBrains+Mono:wght@500;800&family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --inferno: linear-gradient(135deg, #ff4d00 0%, #ffae00 100%);
            --deep-void: #050507;
            --glass: rgba(255, 255, 255, 0.03);
            --neon-border: rgba(255, 77, 0, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Space Grotesk', sans-serif; }
        
        body, html { 
            background: var(--deep-void); color: #fff; 
            height: 100vh; overflow: hidden; position: fixed; width: 100%;
        }

        /* --- BACKGROUND ENGINE --- */
        #canvas-bg { position: fixed; top: 0; left: 0; z-index: -1; filter: blur(4px); }

        /* --- AUTH LAYER (THE FIX) --- */
        #auth-screen {
            position: fixed; inset: 0; z-index: 9999;
            background: radial-gradient(circle at center, #1a0a05 0%, #050507 100%);
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }

        .auth-card {
            width: 100%; max-width: 420px; padding: 50px;
            background: rgba(10, 10, 15, 0.8); backdrop-filter: blur(40px);
            border-radius: 40px; border: 1px solid var(--neon-border);
            box-shadow: 0 0 100px rgba(255, 77, 0, 0.15); text-align: center;
        }

        .auth-card h1 { font-family: 'Outfit'; font-size: 4rem; line-height: 0.9; margin-bottom: 10px; }
        .auth-card p { color: #ffae00; font-family: 'JetBrains Mono'; font-size: 0.7rem; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 40px; }

        .input-group { text-align: left; margin-bottom: 25px; }
        .input-group label { display: block; font-size: 0.6rem; color: #666; margin-left: 15px; margin-bottom: 8px; text-transform: uppercase; font-family: 'JetBrains Mono'; }
        
        .inferno-input {
            width: 100%; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            padding: 20px; border-radius: 20px; color: #fff; font-size: 1rem; transition: 0.3s;
        }
        .inferno-input:focus { border-color: #ff4d00; background: rgba(255, 77, 0, 0.05); outline: none; }

        .btn-init {
            width: 100%; padding: 22px; border-radius: 22px; border: none;
            background: var(--inferno); color: #000; font-weight: 900;
            font-size: 1.2rem; cursor: pointer; font-family: 'Outfit';
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .btn-init:active { transform: scale(0.95); }

        /* --- GAME ENGINE STYLE --- */
        #game-ui { display: none; height: 100vh; flex-direction: column; opacity: 0; transition: 1s; }

        .header { padding: 40px 20px; text-align: center; }
        .money-display { font-family: 'Outfit'; font-size: 5.5rem; letter-spacing: -4px; margin-bottom: 5px; }
        .stats-row { font-family: 'JetBrains Mono'; font-size: 0.8rem; color: #ffae00; opacity: 0.8; }

        .clicker-zone { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
        .main-coin {
            width: 280px; height: 280px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffae00, #ff4d00, #410);
            box-shadow: 0 40px 80px rgba(0,0,0,0.8), inset 0 -10px 40px rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
            font-size: 8rem; font-family: 'Outfit'; cursor: pointer;
            transition: 0.1s cubic-bezier(0, 0, 0, 1); z-index: 10;
        }
        .main-coin:active { transform: scale(0.9) rotate(-3deg); }

        /* --- SHOP & TABS --- */
        .content-screen { display: none; padding: 20px; overflow-y: auto; height: calc(100% - 150px); }
        .active-screen { display: block; animation: slideUp 0.5s forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .item-card {
            background: var(--glass); border: 1px solid rgba(255,255,255,0.05);
            padding: 25px; border-radius: 30px; margin-bottom: 15px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .item-info h3 { font-size: 1.2rem; margin-bottom: 4px; font-family: 'Outfit'; }
        .item-info p { font-size: 0.75rem; color: #888; }
        
        .buy-btn {
            background: #fff; color: #000; border: none; padding: 15px 25px;
            border-radius: 15px; font-weight: 800; font-family: 'JetBrains Mono';
        }
        .buy-btn.locked { opacity: 0.2; }

        .nav-bar {
            position: fixed; bottom: 0; width: 100%; padding: 20px 20px 40px;
            background: rgba(5, 5, 7, 0.95); backdrop-filter: blur(20px);
            display: flex; justify-content: space-around; border-top: 1px solid rgba(255,255,255,0.05);
        }
        .nav-item { background: none; border: none; color: #444; font-weight: 800; font-size: 0.7rem; text-transform: uppercase; }
        .nav-item.active { color: #ff4d00; }

        /* --- FX --- */
        .tap-fx { position: absolute; pointer-events: none; color: #ffae00; font-weight: 900; font-family: 'Outfit'; font-size: 3rem; animation: tapFloat 1s forwards; z-index: 100; }
        @keyframes tapFloat { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-200px) scale(1.5); } }
        
        #notify { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #fff; color: #000; padding: 10px 25px; border-radius: 50px; font-weight: 800; display: none; z-index: 10000; }
    </style>
</head>
<body>

    <canvas id="canvas-bg"></canvas>
    <div id="notify">SAVED</div>

    <div id="auth-screen">
        <div class="auth-card">
            <h1>BUIZNES</h1>
            <p>Inferno Omega v4.0</p>
            
            <div class="input-group">
                <label>Terminal Email</label>
                <input type="email" id="email" class="inferno-input" placeholder="user@empire.io">
            </div>

            <div class="input-group">
                <label>Security Key</label>
                <input type="password" id="pass" class="inferno-input" placeholder="••••••••">
            </div>

            <button class="btn-init" onclick="handleAuth()">INITIALIZE SYNC</button>
            <div id="auth-err" style="color: #ff4d00; font-size: 0.7rem; margin-top: 20px; font-family: 'JetBrains Mono';"></div>
        </div>
    </div>

    <div id="game-ui">
        <div id="screen-main" class="content-screen active-screen">
            <div class="header">
                <div class="stats-row">RANK: <span id="rank">HOBO</span></div>
                <div class="money-display" id="m-val">$ 0</div>
                <div class="stats-row">MINING: +$<span id="s-val">0</span>/s</div>
            </div>

            <div class="clicker-zone">
                <div class="main-coin" onclick="tap(event)">Ω</div>
            </div>
        </div>

        <div id="screen-shop" class="content-screen">
            <h2 style="font-family: 'Outfit'; font-size: 3rem; margin-bottom: 30px;">MARKET</h2>
            <div id="shop-list"></div>
        </div>

        <div id="screen-top" class="content-screen">
            <h2 style="font-family: 'Outfit'; font-size: 3rem; margin-bottom: 30px;">TOP 100</h2>
            <div id="leaderboard"></div>
        </div>

        <nav class="nav-bar">
            <button class="nav-item active" onclick="nav('main')">Empire</button>
            <button class="nav-item" onclick="nav('shop')">Market</button>
            <button class="nav-item" onclick="nav('top')">Ranks</button>
        </nav>
    </div>

    <script>
        // CONFIG
        const CONFIG = {
            dbUrl: "https://buiznesimperia-default-rtdb.firebaseio.com/", // ВСТАВ СВІЙ
            upgrades: [
                { id: 't1', name: 'Inferno Click', d: 'Power x2', cost: 100, mult: 2.5, val: 2, type: 'p' },
                { id: 's1', name: 'CPU Miner', d: '+$5/s', cost: 500, mult: 1.6, val: 5, type: 's' },
                { id: 's2', name: 'GPU Farm', d: '+$50/s', cost: 4000, mult: 1.7, val: 50, type: 's' },
                { id: 's3', name: 'AI Node', d: '+$400/s', cost: 35000, mult: 1.8, val: 400, type: 's' },
                { id: 's4', name: 'Quantum Core', d: '+$5000/s', cost: 250000, mult: 1.9, val: 5000, type: 's' }
            ]
        };

        let user = { m: 0, p: 1, s: 0, uid: null, name: '' };
        let isFBReady = false;

        // 1. ПОЧИНЕНО: Ініціалізація Firebase тільки після кліку або готовності SDK
        function initFB() {
            if (!firebase.apps.length) {
                firebase.initializeApp({ databaseURL: CONFIG.dbUrl });
            }
            isFBReady = true;
        }

        async function handleAuth() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            const err = document.getElementById('auth-err');

            if (e.length < 5) return err.innerText = "INVALID EMAIL";
            
            try {
                initFB(); // Запускаємо базу
                err.innerText = "CONNECTING TO SATELLITES...";
                
                let res = await firebase.auth().signInWithEmailAndPassword(e, p).catch(() => {
                    return firebase.auth().createUserWithEmailAndPassword(e, p);
                });

                user.uid = res.user.uid;
                user.name = e.split('@')[0];
                startApp();
            } catch (e) {
                err.innerText = "SYSTEM ERROR: " + e.message;
            }
        }

        function startApp() {
            document.getElementById('auth-screen').style.display = 'none';
            const ui = document.getElementById('game-ui');
            ui.style.display = 'flex';
            setTimeout(() => ui.style.opacity = '1', 100);

            // Sync Data
            firebase.database().ref('u/' + user.uid).on('value', s => {
                const d = s.val();
                if (d) {
                    user.m = d.m || 0;
                    user.p = d.p || 1;
                    user.s = d.s || 0;
                    refreshUI();
                }
            });

            // Loop
            setInterval(() => {
                if (user.s > 0) {
                    user.m += (user.s / 10);
                    refreshUI();
                }
            }, 100);

            // Auto-save
            setInterval(save, 10000);
            renderShop();
            syncTop();
        }

        function tap(ev) {
            user.m += user.p;
            
            // Visuals
            const fx = document.createElement('div');
            fx.className = 'tap-fx';
            fx.style.left = ev.clientX + 'px';
            fx.style.top = ev.clientY + 'px';
            fx.innerText = `+$${user.p}`;
            document.body.appendChild(fx);
            setTimeout(() => fx.remove(), 1000);
            
            if(navigator.vibrate) navigator.vibrate(10);
            refreshUI();
        }

        function renderShop() {
            const container = document.getElementById('shop-list');
            container.innerHTML = '';
            CONFIG.upgrades.forEach(u => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="item-info">
                        <h3>${u.name}</h3>
                        <p>${u.d}</p>
                    </div>
                    <button class="buy-btn" id="btn-${u.id}" onclick="buy('${u.id}')">$0</button>
                `;
                container.appendChild(card);
            });
        }

        function buy(id) {
            const item = CONFIG.upgrades.find(x => x.id === id);
            let cost = 0;
            if (item.type === 'p') cost = Math.floor(item.cost * Math.pow(item.mult, Math.log2(user.p || 1)));
            else cost = Math.floor(item.cost * Math.pow(item.mult, (user.s / item.val)));

            if (user.m >= cost) {
                user.m -= cost;
                if (item.type === 'p') user.p *= item.val;
                else user.s += item.val;
                save();
                refreshUI();
            }
        }

        function refreshUI() {
            document.getElementById('m-val').innerText = '$' + Math.floor(user.m).toLocaleString();
            document.getElementById('s-val').innerText = user.s.toLocaleString();
            
            // Ranks
            let r = "HOBO";
            if (user.m > 1000) r = "STREET HUSTLER";
            if (user.m > 100000) r = "CORP DRONE";
            if (user.m > 1000000) r = "SHADOW CEO";
            if (user.m > 100000000) r = "OMEGA LORD";
            document.getElementById('rank').innerText = r;

            // Shop prices
            CONFIG.upgrades.forEach(u => {
                let cost = 0;
                if (u.type === 'p') cost = Math.floor(u.cost * Math.pow(u.mult, Math.log2(user.p || 1)));
                else cost = Math.floor(u.cost * Math.pow(u.mult, (user.s / u.val)));
                
                const btn = document.getElementById('btn-' + u.id);
                if (btn) {
                    btn.innerText = '$' + cost.toLocaleString();
                    btn.style.opacity = user.m >= cost ? '1' : '0.3';
                }
            });
        }

        function save() {
            if (!user.uid) return;
            firebase.database().ref('u/' + user.uid).update({
                m: user.m, p: user.p, s: user.s, n: user.name
            });
            showNotify();
        }

        function syncTop() {
            firebase.database().ref('u').orderByChild('m').limitToLast(10).on('value', s => {
                const list = document.getElementById('leaderboard');
                list.innerHTML = '';
                let items = [];
                s.forEach(child => items.push(child.val()));
                items.reverse().forEach((u, i) => {
                    list.innerHTML += `<div class="item-card"><span>#${i+1} ${u.n}</span><b>$${Math.floor(u.m).toLocaleString()}</b></div>`;
                });
            });
        }

        function nav(s) {
            document.querySelectorAll('.content-screen').forEach(scr => scr.classList.remove('active-screen'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('screen-' + s).classList.add('active-screen');
            event.currentTarget.classList.add('active');
        }

        function showNotify() {
            const n = document.getElementById('notify');
            n.style.display = 'block';
            setTimeout(() => n.style.display = 'none', 1000);
        }

        // Background Animation
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let parts = [];
        for(let i=0; i<30; i++) parts.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: Math.random()*100+50, s: Math.random()*0.5+0.1 });

        function anim() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(255, 77, 0, 0.05)';
            parts.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
                ctx.fill();
                p.y -= p.s;
                if(p.y < -100) p.y = canvas.height + 100;
            });
            requestAnimationFrame(anim);
        }
        anim();

    </script>
</body>
</html>
