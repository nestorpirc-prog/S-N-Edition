<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BUIZNES IMPERIA | ELITE SYSTEM</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Plus+Jakarta+Sans:wght@200;400;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --p-green: #22c55e; --p-blue: #3b82f6; --bg: #020617;
            --glass: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: 'Plus Jakarta Sans', sans-serif; }
        body, html { background: var(--bg); color: #fff; height: 100dvh; overflow: hidden; }

        /* --- AUTH SCREEN --- */
        #auth-screen {
            position: fixed; inset: 0; background: var(--bg); z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; padding: 30px;
        }
        .auth-card { background: var(--glass); padding: 30px; border-radius: 30px; border: 1px solid var(--glass-border); backdrop-filter: blur(20px); }
        .auth-input { 
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); 
            padding: 15px; border-radius: 15px; color: #fff; margin-bottom: 15px; outline: none;
        }
        .auth-btn { 
            width: 100%; background: var(--p-green); color: #000; border: none; 
            padding: 15px; border-radius: 15px; font-weight: 900; cursor: pointer;
        }

        /* --- GAME ENGINE UI --- */
        .app { height: 100%; display: flex; flex-direction: column; }
        .screen { display: none; height: 100%; overflow-y: auto; padding: 20px; padding-bottom: 120px; }
        .screen.active { display: block; }

        /* --- 3D-ISH COIN MODEL --- */
        .coin-wrapper { height: 40vh; display: flex; align-items: center; justify-content: center; perspective: 1000px; }
        .coin-model {
            width: 180px; height: 180px; background: #fbbf24; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Outfit'; font-weight: 900; font-size: 5rem; color: #d97706;
            box-shadow: 
                0 0 0 10px #d97706,
                0 20px 50px rgba(251, 191, 36, 0.3);
            transform-style: preserve-3d; transition: 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 5px solid #fef3c7;
        }
        .coin-model:active { transform: scale(0.9) rotateX(20deg); }

        /* --- UPGRADES & LEADERBOARD --- */
        .upgrade-item {
            background: var(--glass); border: 1px solid var(--glass-border);
            padding: 15px; border-radius: 20px; display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 10px; transition: 0.2s;
        }
        .upgrade-item:active { background: rgba(255,255,255,0.1); }
        .buy-btn { background: var(--p-blue); color: #fff; border: none; padding: 8px 15px; border-radius: 10px; font-weight: 800; font-size: 0.7rem; }

        .leader-row { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid var(--glass-border); font-size: 0.85rem; }
        .leader-row span:first-child { color: var(--p-green); font-weight: 800; }

        /* --- NAVIGATION --- */
        .nav { 
            position: fixed; bottom: 0; width: 100%; background: rgba(2,6,23,0.95); 
            backdrop-filter: blur(20px); border-top: 1px solid var(--glass-border);
            display: flex; justify-content: space-around; padding: 15px 10px 30px;
        }
        .nav-item { background: none; border: none; color: #64748b; font-size: 0.65rem; font-weight: 900; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .nav-item.active { color: var(--p-green); }

        .balance-header { text-align: center; padding: 20px 0; }
        .money-txt { font-family: 'Outfit'; font-size: 3.5rem; font-weight: 900; margin: 0; }

        /* FX */
        .float-text { position: fixed; pointer-events: none; color: var(--p-green); font-weight: 900; animation: floatUp 0.8s forwards; z-index: 2000; }
        @keyframes floatUp { to { transform: translateY(-120px); opacity: 0; } }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="auth-card">
            <h2 style="font-family:'Outfit'; margin-bottom: 20px; text-align: center;">BUIZNES LOGIN</h2>
            <input type="email" id="email" class="auth-input" placeholder="Email (any email)">
            <input type="password" id="pass" class="auth-input" placeholder="Password (6+ chars)">
            <button class="auth-btn" onclick="handleAuth()">ENTER IMPERIA</button>
            <p id="auth-error" style="font-size: 0.7rem; color: #ef4444; margin-top: 10px; text-align: center;"></p>
        </div>
    </div>

    <div class="app">
        <div id="screen-game" class="screen active">
            <div class="balance-header">
                <p style="font-size: 0.6rem; letter-spacing: 3px; color: var(--p-blue);">TOTAL EQUITY</p>
                <h1 class="money-txt" id="money-display">$ 0</h1>
                <p id="pps-display" style="font-size: 0.7rem; color: #94a3b8;">Passive: $0/sec</p>
            </div>
            <div class="coin-wrapper">
                <div class="coin-model" onclick="handleTap(event)">B</div>
            </div>
        </div>

        <div id="screen-shop" class="screen">
            <h2 style="font-family:'Outfit'; margin-bottom: 20px;">BLACK MARKET</h2>
            <div id="upgrades-list">
                <div class="upgrade-item">
                    <div>
                        <h4 style="font-size: 0.9rem;">Hustler Grip</h4>
                        <p style="font-size: 0.7rem; color: #94a3b8;">+1 per click</p>
                    </div>
                    <button class="buy-btn" onclick="buyUpgrade('click', 50)">$50</button>
                </div>
                <div class="upgrade-item">
                    <div>
                        <h4 style="font-size: 0.9rem;">Street Bot</h4>
                        <p style="font-size: 0.7rem; color: #94a3b8;">+$2 / sec</p>
                    </div>
                    <button class="buy-btn" onclick="buyUpgrade('passive', 200)">$200</button>
                </div>
            </div>
        </div>

        <div id="screen-top" class="screen">
            <h2 style="font-family:'Outfit'; margin-bottom: 20px;">TOP 10 FOUNDERS</h2>
            <div id="leaderboard-list">
                </div>
        </div>

        <nav class="nav">
            <button class="nav-item active" onclick="showTab('game')">EMPIRE</button>
            <button class="nav-item" onclick="showTab('shop')">SHOP</button>
            <button class="nav-item" onclick="showTab('top')">TOP</button>
        </nav>
    </div>

    <script>
        // --- CONFIG ---
        const firebaseConfig = { databaseURL: "https://buiznesimperia-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        let userData = { money: 0, clickPower: 1, pps: 0, lastUpdate: Date.now() };
        let currentUid = null;

        // --- AUTH LOGIC ---
        function handleAuth() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            auth.signInWithEmailAndPassword(e, p).catch(() => auth.createUserWithEmailAndPassword(e, p))
            .catch(err => document.getElementById('auth-error').innerText = err.message);
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                currentUid = user.uid;
                document.getElementById('auth-screen').style.display = 'none';
                syncFromDb();
                startPassiveIncome();
                initLeaderboard();
            }
        });

        // --- GAME LOGIC ---
        function handleTap(e) {
            userData.money += userData.clickPower;
            updateUI();
            spawnText(e, `+$${userData.clickPower}`);
            if(navigator.vibrate) navigator.vibrate(10);
            saveToDb();
        }

        function buyUpgrade(type, cost) {
            if (userData.money >= cost) {
                userData.money -= cost;
                if (type === 'click') userData.clickPower += 1;
                if (type === 'passive') userData.pps += 2;
                updateUI();
                saveToDb();
            }
        }

        function startPassiveIncome() {
            setInterval(() => {
                if (userData.pps > 0) {
                    userData.money += userData.pps / 10;
                    updateUI();
                }
            }, 100);
            // Auto-save every 10s
            setInterval(() => saveToDb(), 10000);
        }

        // --- SYNC ---
        function saveToDb() {
            if (currentUid) {
                db.ref('users/' + currentUid).set({
                    m: userData.money,
                    cp: userData.clickPower,
                    pps: userData.pps,
                    email: auth.currentUser.email.split('@')[0]
                });
            }
        }

        function syncFromDb() {
            db.ref('users/' + currentUid).once('value', (snap) => {
                const data = snap.val();
                if (data) {
                    userData.money = data.m || 0;
                    userData.clickPower = data.cp || 1;
                    userData.pps = data.pps || 0;
                    updateUI();
                }
            });
        }

        function initLeaderboard() {
            db.ref('users').orderByChild('m').limitToLast(10).on('value', snap => {
                const list = document.getElementById('leaderboard-list');
                list.innerHTML = '';
                let entries = [];
                snap.forEach(child => { entries.push(child.val()); });
                entries.reverse().forEach((u, i) => {
                    list.innerHTML += `<div class="leader-row"><span>#${i+1} ${u.email}</span><span>$${Math.floor(u.m).toLocaleString()}</span></div>`;
                });
            });
        }

        // --- UI UTILS ---
        function updateUI() {
            document.getElementById('money-display').innerText = '$ ' + Math.floor(userData.money).toLocaleString();
            document.getElementById('pps-display').innerText = `Passive: $${userData.pps}/sec`;
        }

        function showTab(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('screen-' + id).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function spawnText(e, txt) {
            const f = document.createElement('div');
            f.className = 'float-text';
            f.style.left = (e.clientX || e.touches[0].clientX) + 'px';
            f.style.top = (e.clientY || e.touches[0].clientY) + 'px';
            f.innerText = txt;
            document.body.appendChild(f);
            setTimeout(() => f.remove(), 800);
        }
    </script>
</body>
</html>
