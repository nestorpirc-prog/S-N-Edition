<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BUIZNES IMPERIA | INFERNO SUPREME</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Space+Grotesk:wght@300;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --fire-gold: #f59e0b;
            --fire-orange: #f97316;
            --fire-red: #ef4444;
            --deep-dark: #09090b;
            --glass: rgba(255, 255, 255, 0.05);
            --neon-blue: #3b82f6;
            --neon-green: #22c55e;
        }

        /* --- ЕКСТРЕМАЛЬНИЙ ФОН (ГАРЯЧІ КОЛЬОРИ) --- */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100dvh; 
            background: var(--deep-dark); color: #fff; 
            font-family: 'Space Grotesk', sans-serif; overflow: hidden; position: fixed;
        }

        .inferno-bg {
            position: fixed; inset: 0; z-index: -1;
            background: linear-gradient(135deg, #450a0a, #7f1d1d, #991b1b, #b91c1c, #450a0a);
            background-size: 400% 400%;
            animation: magmaFlow 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes magmaFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- AUTH: CRYSTAL VIBRANCE STYLE --- */
        #auth-view { 
            display: flex; align-items: center; justify-content: center; height: 100%; padding: 25px;
            z-index: 100; position: relative;
        }

        .auth-card {
            width: 100%; max-width: 460px; background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(50px); border-radius: 60px; padding: 60px 40px;
            border: 2px solid rgba(249, 115, 22, 0.3); box-shadow: 0 0 80px rgba(239, 68, 68, 0.3);
            text-align: center; position: relative;
        }

        .auth-card h1 { 
            font-family: 'Outfit'; font-size: 3.8rem; font-weight: 900; 
            background: linear-gradient(to right, #fbbf24, #ef4444);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 5px; letter-spacing: -2px;
        }

        .auth-tagline { color: #f87171; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 40px; }

        .form-group { text-align: left; margin-bottom: 25px; }
        .form-group label { display: block; font-size: 0.7rem; font-weight: 800; color: #94a3b8; margin-left: 25px; margin-bottom: 10px; text-transform: uppercase; }

        .field-input { 
            width: 100%; background: rgba(255,255,255,0.06); border: 2px solid rgba(255,255,255,0.1);
            padding: 24px 30px; border-radius: 30px; color: #fff; font-size: 1.1rem;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .field-input:focus { border-color: var(--fire-orange); background: rgba(255,255,255,0.1); box-shadow: 0 0 30px rgba(249, 115, 22, 0.2); transform: scale(1.02); }

        .btn-inferno { 
            width: 100%; padding: 26px; border-radius: 30px; border: none;
            background: linear-gradient(90deg, #f59e0b, #ef4444); color: #fff;
            font-family: 'Outfit'; font-size: 1.4rem; font-weight: 900; cursor: pointer;
            box-shadow: 0 15px 35px rgba(239, 68, 68, 0.4); transition: 0.3s;
        }
        .btn-inferno:active { transform: scale(0.92); opacity: 0.9; }

        #status-msg { margin-top: 25px; min-height: 1.2em; font-weight: 700; font-size: 0.9rem; padding: 15px; border-radius: 20px; display: none; }

        /* --- GAME INTERFACE --- */
        #game-ui { display: none; height: 100dvh; flex-direction: column; opacity: 0; transition: 1.2s cubic-bezier(0.4, 0, 0.2, 1); }

        .top-hud { padding: 50px 30px 20px; text-align: center; }
        .rank-badge { background: linear-gradient(90deg, var(--fire-gold), var(--fire-orange)); padding: 8px 20px; border-radius: 100px; font-size: 0.75rem; font-weight: 900; text-transform: uppercase; letter-spacing: 2.5px; box-shadow: 0 5px 15px rgba(245, 158, 11, 0.3); }

        .cash-display { font-family: 'Outfit'; font-size: 6rem; font-weight: 900; margin: 20px 0; letter-spacing: -4px; color: #fff; text-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .income-rate { color: #94a3b8; font-weight: 700; font-size: 1rem; }

        .progress-container { width: 240px; height: 12px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); margin: 25px auto; border-radius: 30px; overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #22c55e); width: 0%; transition: 0.6s ease-out; }

        /* CORE CLICKER */
        .tap-zone { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
        .inferno-coin { 
            width: 280px; height: 280px; border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fbbf24, #b45309, #78350f);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Outfit'; font-size: 9rem; font-weight: 900; color: #451a03;
            border: 15px solid #fffbeb; cursor: pointer;
            box-shadow: 0 50px 120px rgba(0,0,0,0.8), inset 0 0 60px rgba(0,0,0,0.4);
            transition: 0.08s; z-index: 10;
        }
        .inferno-coin:active { transform: scale(0.85) rotate(5deg); }

        /* UPGRADES SCREEN */
        .scroll-view { display: none; height: 100%; overflow-y: auto; padding: 30px 25px 180px; }
        .scroll-view.active { display: block; animation: slideUp 0.6s cubic-bezier(0.23, 1, 0.32, 1) both; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(50px); } to { opacity: 1; transform: translateY(0); } }

        .card-upgrade { 
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 40px; padding: 28px; display: flex; 
            justify-content: space-between; align-items: center; margin-bottom: 18px;
            backdrop-filter: blur(10px);
        }
        .card-upgrade:active { transform: scale(0.96); background: rgba(255,255,255,0.07); }

        .up-meta h4 { font-size: 1.25rem; margin-bottom: 6px; font-weight: 700; color: #fff; }
        .up-meta p { font-size: 0.85rem; color: #64748b; font-weight: 600; }

        .btn-buy { 
            background: #fff; color: #000; border: none; padding: 18px 28px;
            border-radius: 22px; font-weight: 900; font-size: 1rem;
            box-shadow: 0 8px 20px rgba(255,255,255,0.1);
        }
        .btn-buy.afford { background: var(--fire-orange); color: #fff; }

        /* LEADERBOARD */
        .top-list { background: rgba(0,0,0,0.4); border-radius: 40px; border: 1px solid var(--glass); overflow: hidden; }
        .top-row { display: flex; justify-content: space-between; padding: 25px; border-bottom: 1px solid rgba(255,255,255,0.05); font-weight: 700; }
        .top-row.me { background: rgba(245, 158, 11, 0.1); color: var(--fire-gold); }

        /* NAV */
        .bottom-nav { 
            position: fixed; bottom: 0; width: 100%; background: rgba(9,9,11,0.98);
            backdrop-filter: blur(40px); border-top: 2px solid rgba(255,255,255,0.05);
            display: flex; justify-content: space-around; padding: 30px 10px 55px; z-index: 1000;
        }
        .nav-link { 
            background: none; border: none; color: #3f3f46; font-weight: 900;
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            transition: 0.4s;
        }
        .nav-link.active { color: var(--fire-gold); transform: translateY(-8px); }

        /* FX */
        .coin-pop { position: fixed; color: #fbbf24; font-weight: 900; font-size: 3rem; pointer-events: none; animation: popRise 1s forwards; z-index: 5000; text-shadow: 0 10px 30px rgba(0,0,0,1); }
        @keyframes popRise { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-250px) scale(1.6); } }

    </style>
</head>
<body>

    <div class="inferno-bg"></div>

    <div id="auth-view">
        <div class="auth-card">
            <h1>BUIZNES</h1>
            <div class="auth-tagline">Inferno Edition</div>
            
            <div class="form-group">
                <label>Корпоративна Пошта</label>
                <input type="email" id="email-f" class="field-input" placeholder="mail@empire.com">
            </div>

            <div class="form-group">
                <label>Ключ Доступу</label>
                <input type="password" id="pass-f" class="field-input" placeholder="••••••••">
            </div>

            <button class="btn-inferno" onclick="initiateAuth()">ВІДКРИТИ ПОРТФЕЛЬ</button>
            <div id="status-msg"></div>
        </div>
    </div>

    <div id="game-ui">
        
        <div id="scr-game" class="scroll-view active">
            <div class="top-hud">
                <span class="rank-badge" id="u-rank">Завантаження...</span>
                <h1 class="cash-display" id="u-cash">$ 0</h1>
                <div class="income-rate" id="u-pps">Income: $0 / sec</div>
                <div class="progress-container"><div id="p-bar" class="progress-fill"></div></div>
                <div style="font-size: 0.8rem; font-weight: 900; color: #52525b;" id="u-lvl">LVL 1</div>
            </div>

            <div class="tap-zone">
                <div class="inferno-coin" onclick="handleInteraction(event)">B</div>
            </div>
        </div>

        <div id="scr-shop" class="scroll-view">
            <h2 style="font-family:'Outfit'; font-size: 3rem; margin-bottom: 35px; letter-spacing: -2px;">UPGRADES</h2>
            
            <div class="card-upgrade">
                <div class="up-meta"><h4>Muscle Click</h4><p>Збільшує прибуток за тап</p></div>
                <button class="btn-buy" id="b-click" onclick="buyProcess('click')">$50</button>
            </div>

            <div class="card-upgrade">
                <div class="up-meta"><h4>Crypto Bot</h4><p>+$3 / сек пасивно</p></div>
                <button class="btn-buy" id="b-bot" onclick="buyProcess('bot')">$400</button>
            </div>

            <div class="card-upgrade">
                <div class="up-meta"><h4>Luxury Office</h4><p>+$22 / сек пасивно</p></div>
                <button class="btn-buy" id="b-office" onclick="buyProcess('office')">$3,200</button>
            </div>

            <div class="card-upgrade">
                <div class="up-meta"><h4>Mainframe AI</h4><p>+$180 / сек пасивно</p></div>
                <button class="btn-buy" id="b-ai" onclick="buyProcess('ai')">$25,000</button>
            </div>

            <div class="card-upgrade">
                <div class="up-meta"><h4>Space Station</h4><p>+$1,200 / сек пасивно</p></div>
                <button class="btn-buy" id="b-space" onclick="buyProcess('space')">$200,000</button>
            </div>
        </div>

        <div id="scr-top" class="scroll-view">
            <h2 style="font-family:'Outfit'; font-size: 3rem; margin-bottom: 35px; letter-spacing: -2px;">FORBES TOP</h2>
            <div class="top-list" id="global-board"></div>
        </div>

        <nav class="bottom-nav">
            <button class="nav-link active" onclick="switchNav('game')">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M11.5 1L2 6v2l9.5 5 9.5-5V6L11.5 1zM2 10v2l9.5 5 9.5-5v-2l-9.5 5L2 10zm0 4v2l9.5 5 9.5-5v-2l-9.5 5L2 14z"/></svg>
                <span>EMPIRE</span>
            </button>
            <button class="nav-link" onclick="switchNav('shop')">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
                <span>SHOP</span>
            </button>
            <button class="nav-link" onclick="switchNav('top')">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L9 9l-8 .5 6 5.5-2 8 7-4.5 7 4.5-2-8 6-5.5-8-.5L12 1z"/></svg>
                <span>TOP 10</span>
            </button>
        </nav>
    </div>

    <script>
        // --- FIREBASE ENGINE V14.0 ---
        const fbConf = { databaseURL: "https://buiznesimperia-default-rtdb.firebaseio.com/" };
        
        let session = {
            m: 0, p: 1, s: 0, l: 1, e: 0,
            uid: null, nick: ""
        };

        let dbRef = null;

        // Пряма ініціалізація ТІЛЬКИ в момент дії
        function initiateAuth() {
            const email = document.getElementById('email-f').value;
            const pass = document.getElementById('pass-f').value;
            const log = document.getElementById('status-msg');

            if (!email.includes('@') || pass.length < 6) {
                renderLog("Invalid Email or Password (min 6 symbols)", "#ef4444");
                return;
            }

            if (!firebase.apps.length) firebase.initializeApp(fbConf);
            
            renderLog("Connecting to satellites...", "#f59e0b");

            firebase.auth().signInWithEmailAndPassword(email, pass)
                .catch(() => firebase.auth().createUserWithEmailAndPassword(email, pass))
                .catch(err => renderLog(err.message, "#ef4444"));
        }

        firebase.auth().onAuthStateChanged(user => {
            if (user) {
                session.uid = user.uid;
                session.nick = user.email.split('@')[0];
                startEmpire();
            }
        });

        function renderLog(t, c) {
            const m = document.getElementById('status-msg');
            m.style.display = 'block'; m.style.color = c; m.innerText = t;
        }

        // --- CORE GAME LOGIC ---
        function startEmpire() {
            document.getElementById('auth-view').style.display = 'none';
            const ui = document.getElementById('game-ui');
            ui.style.display = 'flex';
            setTimeout(() => ui.style.opacity = '1', 100);

            dbRef = firebase.database().ref('users/' + session.uid);
            dbRef.on('value', snap => {
                const d = snap.val();
                if (d) {
                    session.m = d.m || 0; session.p = d.p || 1;
                    session.s = d.s || 0; session.l = d.l || 1;
                    session.e = d.e || 0;
                    refreshUI();
                }
            });

            // Timers
            setInterval(() => { if (session.s > 0) { session.m += (session.s / 10); refreshUI(); } }, 100);
            setInterval(saveToCloud, 6000);
            loadGlobalTop();
        }

        function handleInteraction(ev) {
            session.m += session.p;
            session.e += 1;
            
            const nextXp = session.l * 120;
            if (session.e >= nextXp) {
                session.l++; session.e = 0;
                if (navigator.vibrate) navigator.vibrate([80, 50, 80]);
            }

            triggerPop(ev);
            refreshUI();
            if (navigator.vibrate) navigator.vibrate(20);
        }

        function buyProcess(id) {
            let price = 0;
            if (id === 'click') {
                price = 50 + (Math.pow(session.p, 1.8) * 45);
                if (session.m >= price) { session.m -= price; session.p++; }
            } else if (id === 'bot') {
                price = 400 + (session.s * 70);
                if (session.m >= price) { session.m -= price; session.s += 3; }
            } else if (id === 'office') {
                price = 3200 + (session.s * 110);
                if (session.m >= price) { session.m -= price; session.s += 22; }
            } else if (id === 'ai') {
                price = 25000 + (session.s * 160);
                if (session.m >= price) { session.m -= price; session.s += 180; }
            } else if (id === 'space') {
                price = 200000 + (session.s * 250);
                if (session.m >= price) { session.m -= price; session.s += 1200; }
            }
            refreshUI();
            saveToCloud();
        }

        // --- CLOUD SYNC ---
        function saveToCloud() {
            if (dbRef) dbRef.update({
                m: session.m, p: session.p, s: session.s,
                l: session.l, e: session.e, u: session.nick
            });
        }

        function loadGlobalTop() {
            firebase.database().ref('users').orderByChild('m').limitToLast(10).on('value', snap => {
                const board = document.getElementById('global-board');
                board.innerHTML = '';
                let list = [];
                snap.forEach(c => list.push(c.val()));
                list.reverse().forEach((u, i) => {
                    const isMe = u.u === session.nick ? 'me' : '';
                    board.innerHTML += `
                        <div class="top-row ${isMe}">
                            <span>#${i+1} ${u.u}</span>
                            <b>$${Math.floor(u.m).toLocaleString()}</b>
                        </div>`;
                });
            });
        }

        // --- VIEW ENGINES ---
        function refreshUI() {
            document.getElementById('u-cash').innerText = '$ ' + Math.floor(session.m).toLocaleString();
            document.getElementById('u-pps').innerText = `Passive: $${session.s} / sec`;
            document.getElementById('u-lvl').innerText = `LVL ${session.l}`;
            
            const xpPct = (session.e / (session.l * 120)) * 100;
            document.getElementById('p-bar').style.width = xpPct + '%';

            // Prices
            document.getElementById('b-click').innerText = '$' + Math.floor(50 + (Math.pow(session.p, 1.8) * 45)).toLocaleString();
            document.getElementById('b-bot').innerText = '$' + Math.floor(400 + (session.s * 70)).toLocaleString();
            document.getElementById('b-office').innerText = '$' + Math.floor(3200 + (session.s * 110)).toLocaleString();
            document.getElementById('b-ai').innerText = '$' + Math.floor(25000 + (session.s * 160)).toLocaleString();
            document.getElementById('b-space').innerText = '$' + Math.floor(200000 + (session.s * 250)).toLocaleString();

            let title = "Hobo Investor";
            if (session.l > 10) title = "Street Hustler";
            if (session.l > 30) title = "Shadow Boss";
            if (session.l > 70) title = "Imperial Tycoon";
            document.getElementById('u-rank').innerText = title;
        }

        function triggerPop(e) {
            const p = document.createElement('div'); p.className = 'coin-pop';
            p.style.left = (e.clientX || e.touches[0].clientX) + 'px';
            p.style.top = (e.clientY || e.touches[0].clientY) + 'px';
            p.innerText = `+$${session.p}`; document.body.appendChild(p);
            setTimeout(() => p.remove(), 950);
        }

        function switchNav(id) {
            document.querySelectorAll('.scroll-view').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
            document.getElementById('scr-' + id).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
