<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BUIZNES IMPERIA | ULTIMATE PLATINUM</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --p-green: #22c55e;
            --p-blue: #3b82f6;
            --p-purple: #a855f7;
            --p-orange: #f97316;
            --p-yellow: #fbbf24;
            --bg: #020617;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-bright: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.1);
            --shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        /* --- БАЗОВІ СТИЛІ --- */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; outline: none; }
        body, html { 
            background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; 
            height: 100dvh; width: 100%; overflow: hidden; position: fixed; 
        }

        /* --- AUTH SCREEN: ДІАГОНАЛЬНИЙ ГРАДІЄНТ --- */
        #auth-layer { 
            position: fixed; inset: 0; z-index: 10000; 
            display: flex; align-items: center; justify-content: center; padding: 20px;
            background: linear-gradient(-45deg, var(--p-yellow), var(--p-orange), var(--p-blue), #2563eb, var(--p-purple));
            background-size: 400% 400%;
            animation: rainbowBG 12s ease infinite;
        }

        @keyframes rainbowBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .auth-container {
            width: 100%; max-width: 440px; background: rgba(2, 6, 23, 0.85); 
            backdrop-filter: blur(40px); border-radius: 50px; padding: 50px 40px;
            border: 1px solid rgba(255, 255, 255, 0.15); box-shadow: var(--shadow);
            text-align: center; position: relative; overflow: hidden;
        }

        .auth-container::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 70%);
            pointer-events: none;
        }

        .auth-logo { font-family: 'Outfit'; font-size: 3rem; font-weight: 900; letter-spacing: -2px; margin-bottom: 10px; }
        .auth-subtitle { color: #94a3b8; font-size: 0.95rem; margin-bottom: 35px; line-height: 1.5; }

        .input-group { position: relative; margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 0.75rem; font-weight: 800; color: #64748b; margin-left: 20px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        
        .auth-input { 
            width: 100%; background: var(--glass); border: 1px solid var(--border); 
            padding: 22px 25px; border-radius: 25px; color: #fff; font-size: 1rem;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .auth-input:focus { border-color: var(--p-blue); background: var(--glass-bright); box-shadow: 0 0 20px rgba(59, 130, 246, 0.2); }

        .auth-btn { 
            width: 100%; background: #fff; color: #000; border: none; 
            padding: 24px; border-radius: 25px; font-weight: 900; font-family: 'Outfit'; 
            font-size: 1.25rem; cursor: pointer; transition: 0.3s; margin-top: 15px;
            box-shadow: 0 10px 30px rgba(255,255,255,0.1);
        }
        .auth-btn:active { transform: scale(0.95); opacity: 0.8; }

        #auth-status { 
            margin-top: 20px; font-size: 0.85rem; padding: 12px; border-radius: 15px; 
            display: none; animation: fadeIn 0.3s;
        }

        /* --- APP INTERFACE --- */
        #app-shell { display: none; height: 100dvh; flex-direction: column; opacity: 0; transition: 1s ease; }
        
        .header { padding: 40px 25px 20px; text-align: center; }
        .user-tag { background: rgba(34, 197, 94, 0.1); color: var(--p-green); padding: 6px 15px; border-radius: 100px; font-size: 0.7rem; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; }

        .main-balance { font-family: 'Outfit'; font-size: 5.5rem; font-weight: 900; letter-spacing: -4px; margin: 15px 0; line-height: 0.9; }
        .sub-stats { color: #64748b; font-weight: 700; font-size: 0.9rem; }

        .xp-frame { width: 200px; height: 10px; background: rgba(255,255,255,0.05); margin: 20px auto; border-radius: 20px; position: relative; border: 1px solid var(--border); }
        #xp-inner { height: 100%; background: linear-gradient(90deg, var(--p-blue), var(--p-green)); border-radius: 20px; width: 0%; transition: 0.5s; }

        /* CLICKER */
        .click-container { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
        .big-coin { 
            width: 260px; height: 260px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fbbf24, #d97706);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Outfit'; font-size: 8.5rem; font-weight: 900; color: #78350f;
            box-shadow: 0 40px 100px rgba(0,0,0,0.7), inset 0 -10px 20px rgba(0,0,0,0.2), inset 0 10px 20px rgba(255,255,255,0.4);
            border: 14px solid #fef3c7; cursor: pointer; transition: 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 5;
        }
        .big-coin:active { transform: scale(0.85) rotate(-3deg); }

        /* SCREENS */
        .screen { display: none; height: 100%; overflow-y: auto; padding: 20px 25px 160px; }
        .screen.active { display: block; animation: screenIn 0.5s both; }
        @keyframes screenIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* SHOP CARDS */
        .section-title { font-family: 'Outfit'; font-size: 2.2rem; margin-bottom: 25px; font-weight: 900; }
        
        .upgrade-item { 
            background: var(--glass); border: 1px solid var(--border); 
            border-radius: 35px; padding: 25px; display: flex; 
            justify-content: space-between; align-items: center; margin-bottom: 15px;
            transition: 0.3s;
        }
        .upgrade-item:active { transform: scale(0.97); background: var(--glass-bright); }

        .up-info h4 { font-size: 1.1rem; margin-bottom: 5px; font-weight: 800; }
        .up-info p { font-size: 0.8rem; color: #94a3b8; font-weight: 600; }

        .price-tag { 
            background: var(--p-blue); color: #fff; border: none; 
            padding: 15px 25px; border-radius: 20px; font-weight: 900; 
            font-size: 0.9rem; min-width: 100px;
        }
        .price-tag.locked { background: #1e293b; color: #475569; }

        /* LEADERBOARD */
        .rank-card { background: var(--glass); border-radius: 30px; border: 1px solid var(--border); overflow: hidden; }
        .rank-row { display: flex; justify-content: space-between; align-items: center; padding: 20px 25px; border-bottom: 1px solid var(--border); }
        .rank-row:last-child { border: none; }
        .rank-row.me { background: rgba(59, 130, 246, 0.1); border-left: 4px solid var(--p-blue); }
        .rank-name { display: flex; align-items: center; gap: 15px; font-weight: 700; }
        .rank-pos { color: var(--p-blue); font-weight: 900; width: 30px; }

        /* NAVIGATION */
        .nav-bar { 
            position: fixed; bottom: 0; width: 100%; background: rgba(2, 6, 23, 0.95); 
            backdrop-filter: blur(30px); border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; padding: 25px 15px 50px; z-index: 1000;
        }
        .nav-item { 
            background: none; border: none; color: #475569; font-weight: 900; 
            font-size: 0.75rem; display: flex; flex-direction: column; 
            align-items: center; gap: 8px; transition: 0.3s;
        }
        .nav-item.active { color: var(--p-green); transform: translateY(-5px); }
        .nav-item span { text-transform: uppercase; letter-spacing: 1px; }

        /* FX */
        .float-val { position: fixed; color: var(--p-green); font-weight: 900; font-size: 2.8rem; pointer-events: none; animation: floatUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards; z-index: 2000; text-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-200px) scale(1.5); } }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="auth-layer">
        <div class="auth-container">
            <div class="auth-logo">BUIZNES</div>
            <p class="auth-subtitle">Увійдіть у свій крипто-портфель, щоб почати масштабування імперії</p>
            
            <div class="input-group">
                <label>Ваша пошта</label>
                <input type="email" id="auth-email" class="auth-input" placeholder="example@gmail.com">
            </div>

            <div class="input-group">
                <label>Секретний пароль</label>
                <input type="password" id="auth-pass" class="auth-input" placeholder="••••••••">
            </div>

            <button class="auth-btn" id="btn-submit" onclick="executeAuth()">ПІДКЛЮЧИТИСЬ ДО БАЗИ</button>
            <div id="auth-status"></div>
        </div>
    </div>

    <div id="app-shell">
        
        <div id="screen-main" class="screen active">
            <div class="header">
                <span class="user-tag" id="tag-rank">Hobo Investor</span>
                <h1 class="main-balance" id="val-cash">$ 0</h1>
                <p class="sub-stats" id="val-pps">Авто-дохід: $0 / сек</p>
                <div class="xp-frame"><div id="xp-inner"></div></div>
                <p id="tag-lvl" style="font-size: 0.7rem; font-weight: 900; color: #475569;">LEVEL 1</p>
            </div>

            <div class="click-container">
                <div class="big-coin" onclick="handleTap(event)">B</div>
            </div>
        </div>

        <div id="screen-shop" class="screen">
            <h2 class="section-title">MARKET</h2>
            <div id="shop-list">
                <div class="upgrade-item">
                    <div class="up-info">
                        <h4>Ручний Майнінг</h4>
                        <p id="desc-click">Зараз: +1 за тап</p>
                    </div>
                    <button class="price-tag" onclick="buyItem('click')" id="cost-click">$50</button>
                </div>

                <div class="upgrade-item">
                    <div class="up-info">
                        <h4>Ферма Богла</h4>
                        <p id="desc-auto1">+$2 / сек автоматично</p>
                    </div>
                    <button class="price-tag" onclick="buyItem('auto1')" id="cost-auto1">$300</button>
                </div>

                <div class="upgrade-item">
                    <div class="up-info">
                        <h4>Офіс розробки</h4>
                        <p id="desc-auto2">+$15 / сек автоматично</p>
                    </div>
                    <button class="price-tag" onclick="buyItem('auto2')" id="cost-auto2">$2,500</button>
                </div>

                <div class="upgrade-item">
                    <div class="up-info">
                        <h4>Дата-центр</h4>
                        <p id="desc-auto3">+$120 / сек автоматично</p>
                    </div>
                    <button class="price-tag" onclick="buyItem('auto3')" id="cost-auto3">$18,000</button>
                </div>
            </div>
        </div>

        <div id="screen-top" class="screen">
            <h2 class="section-title">GLOBAL TOP</h2>
            <div class="rank-card" id="leader-board">
                </div>
        </div>

        <nav class="nav-bar">
            <button class="nav-item active" onclick="changeTab('main')">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 12h3v8h6v-6h2v6h6v-8h3L12 2z"/></svg>
                <span>Головна</span>
            </button>
            <button class="nav-item" onclick="changeTab('shop')">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 18H6v-4h6V9l8 5-8 5v-1zm-2-9V5l-8 5 8 5V9z"/></svg>
                <span>Ринок</span>
            </button>
            <button class="nav-item" onclick="changeTab('top')">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.2h7.6l-6.1 4.4 2.3 7.2-6.2-4.5-6.2 4.5 2.3-7.2-6.1-4.4h7.6z"/></svg>
                <span>Топи</span>
            </button>
        </nav>
    </div>

    <script>
        // --- CONFIG & GLOBAL STATE ---
        const firebaseConfig = { databaseURL: "https://buiznesimperia-default-rtdb.firebaseio.com/" };
        
        let state = {
            money: 0,
            power: 1,
            pps: 0,
            lvl: 1,
            exp: 0,
            lastSave: Date.now()
        };

        let activeUser = null;
        let isSaving = false;

        // --- AUTH ENGINE: ANTI-INITIALIZATION ERROR ---
        function executeAuth() {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            const status = document.getElementById('auth-status');

            if (!email.includes('@') || pass.length < 6) {
                showError("Введіть коректну пошту та пароль!");
                return;
            }

            // ПРЯМА ІНІЦІАЛІЗАЦІЯ ПЕРЕД ВИКЛИКОМ
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            
            status.style.display = 'block';
            status.style.background = 'rgba(59, 130, 246, 0.2)';
            status.style.color = '#fff';
            status.innerText = "Авторизація через супутники...";

            const auth = firebase.auth();
            
            auth.signInWithEmailAndPassword(email, pass)
                .catch(() => auth.createUserWithEmailAndPassword(email, pass))
                .catch(err => showError(err.message));
        }

        firebase.auth().onAuthStateChanged(user => {
            if (user) {
                activeUser = user;
                launchGame();
            }
        });

        function showError(msg) {
            const status = document.getElementById('auth-status');
            status.style.display = 'block';
            status.style.background = 'rgba(239, 68, 68, 0.2)';
            status.style.color = '#ff4d4d';
            status.innerText = "Помилка: " + msg;
        }

        // --- GAME CORE ---
        function launchGame() {
            document.getElementById('auth-layer').style.display = 'none';
            const shell = document.getElementById('app-shell');
            shell.style.display = 'flex';
            setTimeout(() => shell.style.opacity = '1', 50);

            // Sync with DB
            const db = firebase.database();
            db.ref('users/' + activeUser.uid).on('value', snap => {
                if (snap.val()) {
                    const d = snap.val();
                    state.money = d.money || 0;
                    state.power = d.power || 1;
                    state.pps = d.pps || 0;
                    state.lvl = d.lvl || 1;
                    state.exp = d.exp || 0;
                    updateUI();
                }
            });

            // Timers
            setInterval(passiveIncome, 100);
            setInterval(syncData, 5000);
            loadLeaderboard();
        }

        function handleTap(e) {
            state.money += state.power;
            state.exp += 1;

            // Lvl system
            const nextLvl = state.lvl * 100;
            if (state.exp >= nextLvl) {
                state.lvl++;
                state.exp = 0;
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            }

            // Visuals
            createPop(e);
            updateUI();
            if (navigator.vibrate) navigator.vibrate(15);
        }

        function passiveIncome() {
            if (state.pps > 0) {
                state.money += (state.pps / 10);
                updateUI();
            }
        }

        function buyItem(id) {
            let cost = 0;
            if (id === 'click') {
                cost = 50 + (Math.pow(state.power, 1.5) * 40);
                if (state.money >= cost) { state.money -= cost; state.power++; }
            } else if (id === 'auto1') {
                cost = 300 + (state.pps * 50);
                if (state.money >= cost) { state.money -= cost; state.pps += 2; }
            } else if (id === 'auto2') {
                cost = 2500 + (state.pps * 80);
                if (state.money >= cost) { state.money -= cost; state.pps += 15; }
            } else if (id === 'auto3') {
                cost = 18000 + (state.pps * 120);
                if (state.money >= cost) { state.money -= cost; state.pps += 120; }
            }
            updateUI();
            syncData();
        }

        // --- DATA SYNC ---
        function syncData() {
            if (!activeUser || isSaving) return;
            isSaving = true;
            firebase.database().ref('users/' + activeUser.uid).update({
                money: state.money,
                power: state.power,
                pps: state.pps,
                lvl: state.lvl,
                exp: state.exp,
                userName: activeUser.email.split('@')[0],
                updatedAt: firebase.database.ServerValue.TIMESTAMP
            }).then(() => isSaving = false);
        }

        function loadLeaderboard() {
            firebase.database().ref('users').orderByChild('money').limitToLast(10).on('value', snap => {
                const board = document.getElementById('leader-board');
                board.innerHTML = '';
                let list = [];
                snap.forEach(child => list.push(child.val()));
                list.reverse().forEach((u, i) => {
                    const isMe = u.userName === activeUser.email.split('@')[0] ? 'me' : '';
                    board.innerHTML += `
                        <div class="rank-row ${isMe}">
                            <div class="rank-name">
                                <span class="rank-pos">${i+1}</span>
                                <span>${u.userName}</span>
                            </div>
                            <b>$${Math.floor(u.money).toLocaleString()}</b>
                        </div>`;
                });
            });
        }

        // --- UI UTILS ---
        function updateUI() {
            document.getElementById('val-cash').innerText = '$ ' + Math.floor(state.money).toLocaleString();
            document.getElementById('val-pps').innerText = `Авто-дохід: $${state.pps} / сек`;
            document.getElementById('tag-lvl').innerText = `LEVEL ${state.lvl}`;
            
            const xpPct = (state.exp / (state.lvl * 100)) * 100;
            document.getElementById('xp-inner').style.width = xpPct + '%';

            // Rank Titles
            let rank = "Hobo Investor";
            if (state.lvl > 5) rank = "Street Hustler";
            if (state.lvl > 15) rank = "Local Dealer";
            if (state.lvl > 30) rank = "Business Shark";
            if (state.lvl > 50) rank = "Global Tycoon";
            document.getElementById('tag-rank').innerText = rank;

            // Button Costs
            document.getElementById('cost-click').innerText = '$' + Math.floor(50 + (Math.pow(state.power, 1.5) * 40)).toLocaleString();
            document.getElementById('cost-auto1').innerText = '$' + Math.floor(300 + (state.pps * 50)).toLocaleString();
            document.getElementById('cost-auto2').innerText = '$' + Math.floor(2500 + (state.pps * 80)).toLocaleString();
            document.getElementById('cost-auto3').innerText = '$' + Math.floor(18000 + (state.pps * 120)).toLocaleString();
        }

        function createPop(e) {
            const p = document.createElement('div');
            p.className = 'float-val';
            p.style.left = (e.clientX || e.touches[0].clientX) + 'px';
            p.style.top = (e.clientY || e.touches[0].clientY) + 'px';
            p.innerText = `+$${state.power}`;
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 850);
        }

        function changeTab(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('screen-' + id).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function nav(target) { changeTab(target); }
    </script>
</body>
</html>
