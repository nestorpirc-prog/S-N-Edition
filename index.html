<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Equity | VIP Business Clicker</title>
    <style>
        :root {
            --gold: #D4AF37;
            --dark: #0A0A0A;
            --gray: #1A1A1A;
            --green: #00FF41;
        }

        body {
            margin: 0;
            background-color: var(--dark);
            color: white;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Header */
        .header {
            background: var(--gray);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        .brand {
            color: var(--gold);
            font-size: 12px;
            letter-spacing: 4px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        #balance {
            font-size: 40px;
            font-weight: bold;
            margin: 5px 0;
        }

        #income {
            color: var(--green);
            font-size: 14px;
        }

        /* Content Areas */
        .tab-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }

        #market-view { display: none; width: 100%; box-sizing: border-box; }

        /* Clicker Button */
        .main-btn {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: var(--gray);
            border: 3px solid var(--gold);
            color: var(--gold);
            font-size: 50px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
            transition: transform 0.05s;
        }

        .main-btn:active { transform: scale(0.95); }

        /* Business Cards */
        .card {
            background: var(--gray);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #333;
        }

        .card-info h3 { margin: 0; font-size: 16px; }
        .card-info p { margin: 5px 0 0; color: var(--gold); font-size: 13px; }

        .buy-btn {
            background: var(--gold);
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .buy-btn:disabled { background: #555; cursor: not-allowed; }

        /* Footer Navigation */
        .nav {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 70px;
            background: var(--gray);
        }

        .nav-btn {
            background: none;
            border: none;
            color: #888;
            font-weight: bold;
            cursor: pointer;
        }

        .nav-btn.active { color: var(--gold); }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand">GOLDEN EQUITY</div>
        <div id="balance">$ 0</div>
        <div id="income">Passive: $0/sec</div>
    </div>

    <div id="office-view" class="tab-content">
        <button class="main-btn" onclick="handleClick()">GE</button>
        <p style="margin-top: 30px; color: #555; letter-spacing: 1px;">TAP TO GENERATE CAPITAL</p>
    </div>

    <div id="market-view" class="tab-content">
        <div style="width: 100%; max-width: 400px;">
            <div class="card">
                <div class="card-info">
                    <h3>Coffee Shop</h3>
                    <p id="cost-coffee">Cost: $50</p>
                </div>
                <button class="buy-btn" id="btn-coffee" onclick="buyBusiness('coffee')">BUY</button>
            </div>

            <div class="card">
                <div class="card-info">
                    <h3>IT Agency</h3>
                    <p id="cost-it">Cost: $500</p>
                </div>
                <button class="buy-btn" id="btn-it" onclick="buyBusiness('it')">BUY</button>
            </div>
        </div>
    </div>

    <div class="nav">
        <button class="nav-btn active" id="nav-office" onclick="showTab('office')">OFFICE</button>
        <button class="nav-btn" id="nav-market" onclick="showTab('market')">MARKET</button>
    </div>

    <script>
        let money = 0;
        let income = 0;

        const businesses = {
            coffee: { cost: 50, profit: 2, count: 0 },
            it: { cost: 500, profit: 15, count: 0 }
        };

        function handleClick() {
            money += 1;
            updateUI();
            if (window.navigator.vibrate) window.navigator.vibrate(10);
        }

        function buyBusiness(id) {
            let b = businesses[id];
            if (money >= b.cost) {
                money -= b.cost;
                b.count++;
                income += b.profit;
                b.cost = Math.floor(b.cost * 1.4);
                updateUI();
            }
        }

        function updateUI() {
            document.getElementById('balance').innerText = `$ ${Math.floor(money).toLocaleString()}`;
            document.getElementById('income').innerText = `Passive: $${income}/sec`;
            document.getElementById('cost-coffee').innerText = `Cost: $${businesses.coffee.cost}`;
            document.getElementById('cost-it').innerText = `Cost: $${businesses.it.cost}`;

            // Disable buttons if not enough money
            document.getElementById('btn-coffee').disabled = money < businesses.coffee.cost;
            document.getElementById('btn-it').disabled = money < businesses.it.cost;
        }

        function showTab(tab) {
            document.getElementById('office-view').style.display = tab === 'office' ? 'flex' : 'none';
            document.getElementById('market-view').style.display = tab === 'market' ? 'flex' : 'none';
            
            document.getElementById('nav-office').classList.toggle('active', tab === 'office');
            document.getElementById('nav-market').classList.toggle('active', tab === 'market');
        }

        // Passive income loop
        setInterval(() => {
            if (income > 0) {
                money += income;
                updateUI();
            }
        }, 1000);
    </script>
</body>
</html>
