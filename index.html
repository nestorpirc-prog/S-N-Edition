<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BUIZNES IMPERIA | BOSS EDITION</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;900&family=Plus+Jakarta+Sans:wght@200;400;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --p-green: #22c55e; --p-blue: #3b82f6; --bg: #020617;
            --glass: rgba(255, 255, 255, 0.04); --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body, html { 
            background: var(--bg); color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; 
            height: 100dvh; width: 100vw; overflow: hidden; position: fixed;
        }

        /* --- LOADING & AUTH --- */
        #auth-overlay {
            position: fixed; inset: 0; background: var(--bg); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; padding: 30px;
            transition: 0.5s;
        }
        .auth-form { 
            background: var(--glass); padding: 35px; border-radius: 40px; 
            border: 1px solid var(--glass-border); backdrop-filter: blur(30px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        input { 
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); 
            padding: 18px; border-radius: 20px; color: #fff; margin-bottom: 15px; font-size: 1rem;
        }
        .btn-main { 
            width: 100%; background: var(--p-green); color: #000; border: none; 
            padding: 20px; border-radius: 20px; font-weight: 900; font-family: 'Outfit';
            font-size: 1.1rem; cursor: pointer; transition: 0.2s;
        }
        .btn-main:active { transform: scale(0.95); opacity: 0.8; }

        /* --- MAIN APP LAYOUT --- */
        .main-container { height: 100dvh; display: flex; flex-direction: column; opacity: 0; transition: 1s; }
        .main-container.ready { opacity: 1; }

        .screen { display: none; height: 100%; overflow-y: auto; padding: 25px; padding-bottom: 140px; }
        .screen.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        /* --- GAME VISUALS --- */
        .stat-card { text-align: center; padding: 30px 0; }
        .balance { font-family: 'Outfit'; font-size: 4.5rem; font-weight: 900; line-height: 1; margin: 10px 0; letter-spacing: -2px; }
        .sub-stat { font-size: 0.75rem; color: var(--p-blue); font-weight: 800; letter-spacing: 2px; }

        .click-area { height: 40vh; display: flex; align-items: center; justify-content: center; position: relative; }
        .empire-coin {
            width: 220px; height: 220px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fbbf24, #d97706);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Outfit'; font-size: 6rem; font-weight: 900; color: #78350f;
            box-shadow: 0 20px 60px rgba(217, 119, 6, 0.4), inset 0 0 40px rgba(255,255,255,0.3);
            border: 8px solid #fef3c7; cursor: pointer; transition: 0.05s;
            z-index: 10;
        }
        .empire-coin:active { transform: scale(0.85) rotate(-5deg); }

        /* --- SHOP & LEADERBOARD --- */
        .list-item {
            background: var(--glass); border: 1px solid var(--glass-border);
            padding: 20px; border-radius: 25px; display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 12px;
        }
        .buy-btn { 
            background: var(--p-blue); color: #fff; border: none; padding: 12px 20px; 
            border-radius: 15px; font-weight: 900; font-size: 0.8rem;
        }
        .buy-btn:disabled { opacity: 0.3; background: #475569; }

        .rank-row { display: flex; justify-content: space-between; padding: 15px; border-bottom: 1px solid var(--glass-border); }
        .rank-row.me { background: rgba(59, 130, 246, 0.1); border-radius: 15px; border: 1px solid var(--p-blue); }

        /* --- NAV BAR --- */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; background: rgba(2,6,23,0.9);
            backdrop-filter: blur(25px); border-top: 1px solid var(--glass-border);
            display: flex; justify-content: space-around; padding: 15px 10px 40px; z-index: 100;
        }
        .nav-tab { background: none; border: none; color: #64748b; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .nav-tab.active { color: var(--p-green); }
        .nav-tab i { font-size: 1.5rem; font-style: normal; }
        .nav-tab span { font-size: 0.6rem; font-weight: 900; text-transform: uppercase; }

        /* FX */
        .plus-one { position: fixed; color: var(--p-green); font-weight: 900; font-size: 2rem; pointer-events: none; animation: flyUp 0.8s forwards; z-index: 999; }
        @keyframes flyUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-150px) scale(1.5); } }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-form">
            <h1 style="font-family:'Outfit'; text-align: center; margin-bottom: 10px;">BUIZNES ENTRY</h1>
            <p style="text-align: center; font-size: 0.8rem; color: var(--p-blue); margin-bottom: 25px;">Enter your credentials to sync progress</p>
            <input type="email" id="user-email" placeholder="Empire Email">
            <input type="password" id="user-pass" placeholder="Master Password (6+ chars)">
            <button class="btn-main" onclick="startEngine()">ACCESS DATABASE</button>
            <p id="error-msg" style="color: #ef4444; font-size: 0.7rem; text-align: center; margin-top: 15px; height: 10px;"></p>
        </div>
        <p style="text-align: center; margin-top: 30px; font-size: 0.6rem; opacity: 0.3;">SECURE CONNECTION BY NESTOR & SANYA</p>
    </div>

    <div class="main-container" id="app-ui">
        
        <div id="tab-game" class="screen active">
            <div class="stat-card">
                <p class="sub-stat" id="rank-tag">RANK: HOBO</p>
                <h1 class="balance" id="cash-txt">$ 0</h1>
                <p style="font-size: 0.8rem; color: #94a3b8;" id="auto-txt">Passive: $0/sec</p>
            </div>
            <div class="click-area">
                <div class="empire-coin" id="coin-trigger" onclick="handleTap(event)">B</div>
            </div>
        </div>

        <div id="tab-shop" class="screen">
            <h2 style="font-family:'Outfit'; margin-bottom: 25px;">UPGRADES</h2>
            <div id="shop-items">
                <div class="list-item">
                    <div><h4 style="font-size: 0.9rem;">Hustler Grip</h4><p style="font-size: 0.7rem; color: #94a3b8;">+1 per click</p></div>
                    <button class="buy-btn" id="up-click" onclick="buy('click')">$50</button>
                </div>
                <div class="list-item">
                    <div><h4 style="font-size: 0.9rem;">Street Bot</h4><p style="font-size: 0.7rem; color: #94a3b8;">+$2 per sec</p></div>
                    <button class="buy-btn" id="up-auto" onclick="buy('auto')">$250</button>
                </div>
                <div class="list-item">
                    <div><h4 style="font-size: 0.9rem;">Office Suite</h4><p style="font-size: 0.7rem; color: #94a3b8;">+$15 per sec</p></div>
                    <button class="buy-btn" id="up-office" onclick="buy('office')">$2,000</button>
                </div>
            </div>
        </div>

        <div id="tab-top" class="screen">
            <h2 style="font-family:'Outfit'; margin-bottom: 25px;">GLOBAL LEADERBOARD</h2>
            <div id="leaderboard-box">
                </div>
        </div>

        <nav class="bottom-nav">
            <button class="nav-tab active" onclick="nav('game')"><i>💰</i><span>Empire</span></button>
            <button class="nav-tab" onclick="nav('shop')"><i>⚡</i><span>Upgrades</span></button>
            <button class="nav-tab" onclick="nav('top')"><i>🏆</i><span>Rankings</span></button>
        </nav>
    </div>

    <script>
        // --- FIREBASE SETUP ---
        const firebaseConfig = { databaseURL: "https://buiznesimperia-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        let state = { cash: 0, clickPower: 1, pps: 0, lastSync: 0 };
        let uid = null;

        // --- AUTH ENGINE (NO BUGS) ---
        async function startEngine() {
            const email = document.getElementById('user-email').value;
            const pass = document.getElementById('user-pass').value;
            const err = document.getElementById('error-msg');
            
            if (pass.length < 6) { err.innerText = "Password too short!"; return; }

            try {
                // Спершу пробуємо створити, якщо не виходить - входимо
                await auth.createUserWithEmailAndPassword(email, pass).catch(() => {
                    return auth.signInWithEmailAndPassword(email, pass);
                });
            } catch (e) {
                err.innerText = e.message;
            }
        }

        auth.onAuthStateChanged(user => {
            if (user) {
                uid = user.uid;
                document.getElementById('auth-overlay').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('auth-overlay').style.display = 'none';
                    document.getElementById('app-ui').classList.add('ready');
                }, 500);
                
                initData();
                startLoops();
                syncLeaderboard();
            }
        });

        // --- GAMEPLAY ---
        function handleTap(e) {
            state.cash += state.clickPower;
            updateUI();
            fx(e, `+$${state.clickPower}`);
            if(navigator.vibrate) navigator.vibrate(12);
        }

        function buy(type) {
            const costs = { click: 50 * state.clickPower, auto: 250 + (state.pps * 10), office: 2000 + (state.pps * 5) };
            let cost = 0;
            
            if(type === 'click') {
                cost = 50 + (state.clickPower * 25);
                if(state.cash >= cost) { state.cash -= cost; state.clickPower++; }
            } else if(type === 'auto') {
                cost = 250 + (state.pps * 50);
                if(state.cash >= cost) { state.cash -= cost; state.pps += 2; }
            } else if(type === 'office') {
                cost = 2000 + (state.pps * 100);
                if(state.cash >= cost) { state.cash -= cost; state.pps += 15; }
            }
            updateUI();
            save();
        }

        // --- DATA & SYNC ---
        function initData() {
            db.ref('users/' + uid).on('value', snap => {
                const d = snap.val();
                if (d && Date.now() - state.lastSync > 2000) { // Захист від циклічного оновлення
                    state.cash = d.c || 0;
                    state.clickPower = d.cp || 1;
                    state.pps = d.p || 0;
                    updateUI();
                }
            });
        }

        function save() {
            if(!uid) return;
            state.lastSync = Date.now();
            db.ref('users/' + uid).set({
                c: state.cash, cp: state.clickPower, p: state.pps,
                u: auth.currentUser.email.split('@')[0], t: Date.now()
            });
        }

        function startLoops() {
            // Пасивний дохід (кожні 100мс для плавності)
            setInterval(() => {
                if(state.pps > 0) {
                    state.cash += (state.pps / 10);
                    updateUI();
                }
            }, 100);
            
            // Авто-сейв кожні 5 сек
            setInterval(() => save(), 5000);
        }

        function syncLeaderboard() {
            db.ref('users').orderByChild('c').limitToLast(10).on('value', snap => {
                const box = document.getElementById('leaderboard-box');
                box.innerHTML = '';
                let rows = [];
                snap.forEach(c => { rows.push(c.val()); });
                rows.reverse().forEach((r, i) => {
                    const isMe = r.u === auth.currentUser.email.split('@')[0] ? 'me' : '';
                    box.innerHTML += `<div class="rank-row ${isMe}"><span>#${i+1} ${r.u}</span><b>$${Math.floor(r.c).toLocaleString()}</b></div>`;
                });
            });
        }

        // --- UI & FX ---
        function updateUI() {
            document.getElementById('cash-txt').innerText = '$ ' + Math.floor(state.cash).toLocaleString();
            document.getElementById('auto-txt').innerText = `Passive: $${state.pps}/sec`;
            
            let rank = "HOBO";
            if(state.cash > 1000) rank = "STREET HUSTLER";
            if(state.cash > 10000) rank = "BUSINESS DELEGATE";
            if(state.cash > 100000) rank = "GLOBAL TYCOON";
            document.getElementById('rank-tag').innerText = "RANK: " + rank;
            
            // Оновлення цін на кнопках
            document.getElementById('up-click').innerText = '$' + (50 + (state.clickPower * 25)).toLocaleString();
            document.getElementById('up-auto').innerText = '$' + (250 + (state.pps * 50)).toLocaleString();
            document.getElementById('up-office').innerText = '$' + (2000 + (state.pps * 100)).toLocaleString();
        }

        function nav(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + id).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function fx(e, t) {
            const d = document.createElement('div');
            d.className = 'plus-one';
            d.style.left = (e.clientX || e.touches[0].clientX) + 'px';
            d.style.top = (e.clientY || e.touches[0].clientY) + 'px';
            d.innerText = t;
            document.body.appendChild(d);
            setTimeout(() => d.remove(), 800);
        }
    </script>
</body>
</html>
